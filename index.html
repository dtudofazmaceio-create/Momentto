<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FotoEvento</title>
<meta name="description" content="Álbum colaborativo de fotos para eventos">
<meta name="theme-color" content="#f5f3ef">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FotoEvento">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
/* ============ BASE (sistema) ============ */
:root{
  --accent:#e11d48;--accent-ink:#fff;
  --bg:#f5f3ef;--card:#fff;--ink:#17161a;--muted:#6b6873;--line:#e7e3dc;--soft:#eeeae4;--glass:rgba(245,243,239,.8);
  --radius:20px;--shadow:0 1px 2px rgba(20,16,10,.05),0 10px 30px -14px rgba(20,16,10,.18);
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --tfont:var(--display);--tweight:800;--tls:-.04em;--ttr:none;--tile-r:14px;--row:132px;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
html[data-theme=dark]{--bg:#0f0f12;--card:#18181c;--ink:#f3f1ee;--muted:#9c99a4;--line:#2a2a31;--soft:#222228;--glass:rgba(15,15,18,.78);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100dvh;font-size:15.5px;line-height:1.5;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
#pageBg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-size:cover;background-position:center}
#pageBg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--veil,0)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-.025em;margin:0;line-height:1.08;font-weight:700}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}.small{font-size:13.5px}.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}.row.end{justify-content:flex-end}.wrap-row{flex-wrap:wrap}.spacer{flex:1}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.eyebrow.light{color:rgba(255,255,255,.85)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ttl{font-family:var(--tfont);font-weight:var(--tweight);letter-spacing:var(--tls);text-transform:var(--ttr)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink);text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;white-space:nowrap;line-height:1.2;font-family:var(--font)}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.soft{background:color-mix(in srgb,var(--accent) 12%,var(--card));color:color-mix(in srgb,var(--accent) 80%,var(--ink))}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.glass{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.btn.wa{background:#25d366;color:#05371b}
.btn.danger{background:#fde8e8;color:#b42318}
html[data-theme=dark] .btn.danger{background:#3b1514;color:#fda29b}
.btn.sm{padding:8px 14px;font-size:13.5px}.btn.lg{padding:15px 24px;font-size:16px}.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:42px;height:42px;flex:none;border-radius:50%;border:0;display:inline-grid;place-items:center;background:transparent;color:inherit;transition:background .15s;text-decoration:none}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.icon-btn.light{background:rgba(255,255,255,.14);color:#fff}.icon-btn.light:hover{background:rgba(255,255,255,.26)}

/* forms & cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
input,textarea,select{font:inherit;width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}
textarea{resize:vertical;min-height:72px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
input[type=range]{padding:0;border:0;box-shadow:none;accent-color:var(--accent);background:none}
label.f{display:block;font-weight:600;font-size:14px;margin:0 0 7px}
.opt{font-weight:400;color:var(--muted)}
.field{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.switch{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;margin-bottom:10px;background:var(--card)}
.switch input{display:none}
.switch .knob{flex:none;width:44px;height:26px;border-radius:99px;background:color-mix(in srgb,var(--muted) 45%,var(--line));position:relative;transition:background .2s;margin-top:1px}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+.knob{background:var(--accent)}
.switch input:checked+.knob::after{transform:translateX(18px)}
.switch b{display:block;font-size:14.5px}.switch .d{font-size:13px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;background-size:cover}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.sw.big{width:auto;height:46px;border-radius:14px;padding:0 14px;font-size:12.5px;font-weight:700;color:#222;min-width:84px}
.sw-custom{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative}
.sw-custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;padding:0}
.seg{display:inline-flex;background:var(--soft);border-radius:14px;padding:4px;gap:2px;flex-wrap:wrap;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:#fff7e6;color:#7a4b00;font-size:14px;border:1px solid #f6dfae}
.alert.info{background:color-mix(in srgb,var(--accent) 8%,var(--card));color:var(--ink);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.alert svg{flex:none;margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--card);color:var(--ink)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#12b76a}.pill.off .dot{background:#98a2b3}
.pill.warn{background:#fef0c7;color:#93370d}

/* toast / modal / sheet */
#toasts{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
@media(min-width:960px){#toasts{bottom:24px}}
.toast{background:#17161a;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);animation:tin .3s ease;pointer-events:auto}
.toast.err{background:#b42318}.toast.ok{background:#067647}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.modal-bg{position:fixed;inset:0;background:rgba(14,12,10,.52);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{background:var(--card);color:var(--ink);border-radius:26px;padding:26px;width:100%;max-width:470px;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:up .25s cubic-bezier(.2,.9,.3,1.1)}
.modal.wide{max-width:660px}
.modal h3{font-size:24px;margin-bottom:8px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}
@keyframes fade{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(18px)}}
@media(max-width:600px){.modal-bg{place-items:end center;padding:0}.modal{border-radius:26px 26px 0 0;max-height:94dvh;padding:12px 20px calc(22px + var(--sab))}.modal::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}.grid2{grid-template-columns:1fr}}
.sheet-list{display:flex;flex-direction:column;gap:4px}
.sheet-item{display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:14px;border:0;background:transparent;text-align:left;font-weight:600;font-size:15.5px;width:100%;text-decoration:none}
.sheet-item:hover{background:var(--soft)}
.sheet-item .si-ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.sheet-item small{display:block;font-weight:400;color:var(--muted);font-size:13px}

/* screens */
.screen{min-height:100dvh;display:grid;place-items:center;padding:30px 20px;text-align:center}
.screen .box{max-width:420px}
.ico-big{width:72px;height:72px;border-radius:24px;background:color-mix(in srgb,var(--accent) 13%,var(--card));color:var(--accent);display:grid;place-items:center;margin:0 auto 20px}
.screen h2{font-size:28px;margin-bottom:10px}.screen p{color:var(--muted);margin-bottom:22px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid color-mix(in srgb,var(--accent) 20%,transparent);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--soft) 0,var(--card) 50%,var(--soft) 100%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:var(--radius);height:280px}
@keyframes sk{to{background-position:-200% 0}}
.empty{padding:50px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--radius);color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px;margin:0 0 6px}

/* ============ SHELL (app no celular / sistema no computador) ============ */
.shell{min-height:100dvh}
.side{display:none}
.main{min-width:0}
.appbar{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px);border-bottom:1px solid var(--line);padding-top:var(--sat)}
.appbar-in{height:62px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px}
.ab-title{flex:1;min-width:0}
.ab-title h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-title p{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mob-brand{width:36px;height:36px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none;margin-right:4px}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px 12px}
.subtabs::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 15px;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.65;font-weight:600}
.content{padding:18px 16px calc(110px + var(--sab));max-width:1240px}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px calc(6px + var(--sab));background:var(--glass);backdrop-filter:saturate(1.5) blur(20px);-webkit-backdrop-filter:saturate(1.5) blur(20px);border-top:1px solid var(--line)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 0;border:0;background:none;min-width:0}
.tab-item span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab-item .tb-ic{height:30px;display:grid;place-items:center;width:52px;border-radius:99px;transition:background .2s}
.tab-item.on{color:var(--ink)}
.tab-item.on .tb-ic{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tab-item.primary .tb-ic{width:52px;height:52px;border-radius:18px;background:var(--accent);color:var(--accent-ink);margin-top:-22px;box-shadow:0 10px 22px -8px color-mix(in srgb,var(--accent) 80%,#000)}
@media(min-width:960px){
  .shell{display:grid;grid-template-columns:272px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;padding:22px 16px 18px;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .tabbar{display:none}
  .mob-brand{display:none}
  .appbar-in{height:78px;padding:0 34px}
  .ab-title h1{font-size:26px}
  .subtabs{padding:0 34px 14px}
  .content{padding:28px 34px 60px}
}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.03em;padding:4px 8px 22px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none;overflow:hidden;background-size:cover}
.side-nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:14px;color:var(--muted);font-weight:600;text-decoration:none;font-size:15px;transition:background .15s,color .15s}
.nav-item:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink)}
.nav-item.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.nav-item.primary{background:var(--accent);color:var(--accent-ink);margin-bottom:12px;justify-content:center}
.nav-item .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.user-chip{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;padding:8px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.user-chip img,.user-chip .av{width:32px;height:32px;border-radius:50%;background:var(--soft);flex:none}
.user-chip small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.side-event{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:16px}
.side-event .sc{height:84px;border-radius:12px;background:var(--accent) center/cover;margin-bottom:10px}
.side-event b{font-family:var(--display);font-size:17px;display:block;line-height:1.15}

/* page parts (sistema) */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h2{font-size:clamp(26px,4vw,38px)}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.ev-card{display:block;text-decoration:none;overflow:hidden;transition:transform .2s,box-shadow .2s}
.ev-card:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(0,0,0,.05),0 22px 40px -18px rgba(20,16,10,.35)}
.ev-cover{height:150px;background:var(--c,#333) center/cover no-repeat;position:relative}
.ev-cover.noimg{background-image:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--c) 65%,#fff) 0,transparent 55%),linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 40%,#000))}
.ev-cover .pill{position:absolute;top:12px;left:12px}
.ev-cover .tipo{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;backdrop-filter:blur(6px)}
.ev-body{padding:16px 18px 18px}
.ev-body h3{font-size:20px;margin-bottom:6px}
.ev-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13.5px}
.ev-meta span{display:inline-flex;align-items:center;gap:5px}
.ev-count{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted)}
.ev-count b{font-family:var(--display);font-size:19px;color:var(--ink)}
.ev-head{display:grid;grid-template-columns:260px 1fr;overflow:hidden;margin-bottom:18px}
.ev-head .ev-cover{height:100%;min-height:190px}
.ev-head-body{padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.ev-head-body h2{font-size:clamp(26px,3.5vw,36px)}
@media(max-width:700px){.ev-head{grid-template-columns:1fr}.ev-head .ev-cover{min-height:140px}.ev-head-body{padding:18px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr);gap:10px}}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:26px}
@media(max-width:420px){.links{grid-template-columns:1fr}}
.link-card{display:grid;grid-template-columns:140px 1fr;gap:18px;padding:18px}
.link-card.hl{border:2px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.qr-box{width:140px;height:140px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);padding:5px}
.qr-box svg{width:100%;height:100%;display:block}
.link-body h3{font-size:18px;margin-bottom:4px}
.link-body p{font-size:13.5px;margin-bottom:10px}
.url-box input{font-size:12px;padding:8px 11px;border-radius:10px;background:var(--soft);border-color:transparent;margin-bottom:10px;color:var(--muted)}
@media(max-width:520px){.link-card{grid-template-columns:1fr}.qr-box{width:180px;height:180px;margin:0 auto}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.sec-head h2{font-size:24px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
@media(max-width:520px){.agrid{grid-template-columns:repeat(2,1fr);gap:10px}}
.atile{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative}
.atile-img{display:block;width:100%;aspect-ratio:1;border:0;padding:0;background:var(--soft)}
.atile-img img{width:100%;height:100%;object-fit:cover}
.atile.st-oculta .atile-img img{opacity:.35;filter:grayscale(1)}
.atile .badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#fff;color:#17161a}
.atile.st-pendente .badge{background:#fef0c7;color:#93370d}.atile.st-oculta .badge{background:#344054;color:#fff}
.atile-bar{padding:6px 6px 6px 12px;display:flex;align-items:center;justify-content:space-between;gap:2px}
.atile-bar .who{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;flex:none}
.acts .icon-btn{width:32px;height:32px}
.icon-btn.ok{color:#079455}.icon-btn.del{color:#d92d20}
.nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.nitem{padding:16px;display:flex;flex-direction:column;gap:10px}
.nitem.st-oculta{opacity:.55}
.nitem blockquote{margin:0;font-size:15.5px}
.nitem footer{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
.danger-zone{margin-top:36px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-color:#f7d4d1}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.qa{display:flex;align-items:center;gap:14px;padding:16px;text-decoration:none;border:1px solid var(--line);text-align:left;width:100%;transition:transform .15s}
.qa:hover{transform:translateY(-2px)}
.qa .qi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 13%,var(--card));color:var(--accent);flex:none}
.qa b{display:block;font-size:15px}.qa small{color:var(--muted);font-size:12.5px;display:block;line-height:1.3}
.hello{position:relative;overflow:hidden;color:#fff;padding:26px 24px;margin-bottom:18px;border:0;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--accent) center/cover}
.hello::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.7))}
.hello>*{position:relative}
.hello h2{font-size:clamp(28px,5vw,42px);margin-bottom:4px}
.hello.noimg{background-image:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--accent) 60%,#fff),transparent 55%),linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 40%,#000))}

/* personalizar */
.pz{display:flex;flex-direction:column;gap:16px;max-width:900px}
.pz-sec{padding:20px}
.pz-sec>h3{font-size:19px;margin-bottom:4px}
.pz-sec>p.muted{margin-bottom:14px;font-size:13.5px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
@media(max-width:520px){.tpl-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.tplc{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:8px 8px 12px;text-align:left;transition:border-color .2s,transform .15s}
.tplc:hover{transform:translateY(-2px)}
.tplc.on{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.tplc b{display:block;font-size:14.5px;margin:10px 4px 0}.tplc span{display:block;font-size:12px;color:var(--muted);margin:2px 4px 0;line-height:1.3}
.tpl-thumb{height:132px;border-radius:12px;overflow:hidden;background:var(--bg);color:var(--ink);padding:8px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.tt-hero{height:56px;border-radius:6px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 35%,#000));display:flex;align-items:flex-end;padding:6px 8px;flex:none}
.tt-t{font-family:var(--tfont);font-weight:var(--tweight);text-transform:var(--ttr);letter-spacing:var(--tls);color:#fff;font-size:16px;line-height:1;white-space:nowrap}
.tt-g{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tt-g i{background:color-mix(in srgb,var(--accent) 28%,var(--soft));border-radius:var(--tile-r)}
.th-centered .tt-hero{justify-content:center;align-items:center}
.th-arch .tt-hero,.th-split .tt-hero,.th-polaroid .tt-hero{background:none;padding:0;gap:8px;align-items:center}
.th-arch .tt-hero::after{content:"";order:2;margin-left:auto;width:36px;height:52px;border-radius:30px 30px 4px 4px;background:var(--accent)}
.th-split .tt-hero::after{content:"";margin-left:auto;width:52px;height:52px;background:var(--accent)}
.th-polaroid .tt-hero::before{content:"";width:40px;height:44px;background:var(--accent);border:4px solid #fff;border-bottom-width:9px;transform:rotate(-5deg);box-shadow:0 2px 5px rgba(0,0,0,.2)}
.th-arch .tt-t,.th-split .tt-t,.th-polaroid .tt-t{color:var(--ink);font-size:18px}
.tg-polaroid i{background:#fff;border:3px solid #fff;border-bottom-width:7px;box-shadow:0 1px 3px rgba(0,0,0,.18);background-image:linear-gradient(color-mix(in srgb,var(--accent) 30%,var(--soft)),color-mix(in srgb,var(--accent) 30%,var(--soft)))}
.tg-square{gap:1px!important}
.tg-masonry i:nth-child(odd){grid-row:span 2}
.cover-prev{height:160px;border-radius:16px;background:var(--accent) center/cover no-repeat;margin-bottom:12px;border:1px solid var(--line)}
.cover-prev.noimg{background-image:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--accent) 60%,#fff),transparent 55%),linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 40%,#000))}
.bg-prev{height:110px;border-radius:16px;border:1px solid var(--line);margin-top:12px;position:relative;overflow:hidden;background:var(--soft) center/cover}
.savebar{position:sticky;bottom:calc(84px + var(--sab));z-index:30;display:flex;gap:10px;padding:12px;border-radius:20px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--shadow)}
.savebar .btn{flex:1}
@media(min-width:960px){.savebar{bottom:16px}.savebar .btn{flex:none}}
.pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:60vh;overflow:auto}
.pick-grid button{border:0;padding:0;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft)}
.pick-grid img{width:100%;height:100%;object-fit:cover}

/* uploader */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:26px 12px;border-radius:20px;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--card));color:color-mix(in srgb,var(--accent) 80%,var(--ink));font-weight:700;font-size:15px;cursor:pointer;transition:transform .15s,background .2s;text-align:center}
.drop:hover,.drop.dragover{background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.drop:active{transform:scale(.98)}
.drop small{font-weight:500;color:var(--muted);font-size:12.5px}
.pick-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.previews{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:16px}
.previews:empty{display:none}
.pv{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft)}
.pv img{width:100%;height:100%;object-fit:cover}
.pv .rm{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.pv .st{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.55)}
.pv .st .spinner{width:24px;height:24px;margin:0;border-width:2.5px}
.pv.err::after{content:"Erro";position:absolute;inset:0;display:grid;place-items:center;background:rgba(180,35,24,.75);color:#fff;font-weight:700;font-size:13px}
.progress{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:18px 0 8px}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s}

/* setup */
.setup{max-width:580px;margin:0 auto;padding:calc(40px + var(--sat)) 20px 80px}
.setup h1{font-size:clamp(32px,6vw,46px);margin-bottom:12px}
.steps{counter-reset:s;list-style:none;padding:0;margin:22px 0}
.steps li{counter-increment:s;position:relative;padding-left:44px;margin-bottom:14px;font-size:14.5px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.steps a{color:var(--accent);font-weight:600}
code{background:var(--soft);padding:2px 6px;border-radius:6px;font-size:.9em}
.help h4{margin:18px 0 6px;font-size:15px}.help p,.help li{font-size:14px;color:var(--muted)}

/* ============ MODELOS DO SITE DO EVENTO ============ */
.tpl-moderno{--bg:#f7f5f2;--card:#fff;--ink:#17161a;--muted:#6b6873;--line:#e8e4de;--soft:#efebe5;--glass:rgba(247,245,242,.86);--tfont:'Bricolage Grotesque',sans-serif;--tweight:800;--tls:-.045em;--ttr:none;--tile-r:14px}
.tpl-classico{--bg:#f8f4ec;--card:#fffdf8;--ink:#2b2520;--muted:#7d7266;--line:#e6dccd;--soft:#efe6d6;--glass:rgba(248,244,236,.9);--tfont:'Cormorant Garamond',serif;--tweight:600;--tls:-.01em;--ttr:none;--tile-r:2px}
.tpl-romantico{--bg:#fcf3f2;--card:#fffafa;--ink:#4b3036;--muted:#977a80;--line:#f1dcdc;--soft:#f6e4e3;--glass:rgba(252,243,242,.9);--tfont:'Great Vibes',cursive;--tweight:400;--tls:0;--ttr:none;--tile-r:18px}
.tpl-festa{--bg:#0b0a10;--card:#16131d;--ink:#f7f4ff;--muted:#a59fb6;--line:#2a2535;--soft:#1f1b29;--glass:rgba(11,10,16,.82);--tfont:'Anton',sans-serif;--tweight:400;--tls:.01em;--ttr:uppercase;--tile-r:10px;--shadow:0 10px 30px -14px rgba(0,0,0,.7)}
.tpl-minimal{--bg:#fff;--card:#fff;--ink:#0f0f10;--muted:#77767c;--line:#ececec;--soft:#f4f4f5;--glass:rgba(255,255,255,.92);--tfont:'DM Sans',sans-serif;--tweight:600;--tls:-.05em;--ttr:none;--tile-r:0px;--shadow:none}
.tpl-polaroid{--bg:#eee4d3;--card:#fffdf7;--ink:#2e2a24;--muted:#7a6f60;--line:#ddd0bb;--soft:#e4d7c1;--glass:rgba(238,228,211,.9);--tfont:'Caveat',cursive;--tweight:700;--tls:0;--ttr:none;--tile-r:3px}
.evpage{background:var(--bg);color:var(--ink)}
.evpage h2,.evpage h3{color:var(--ink)}
.evpage.tpl-polaroid{background-image:radial-gradient(rgba(120,90,50,.07) 1px,transparent 1.4px);background-size:7px 7px}

/* heróis */
.hbg{position:absolute;inset:-2px;background:var(--accent) center/cover no-repeat}
.hbg.noimg,.himg.noimg{background-image:radial-gradient(circle at 15% 25%,color-mix(in srgb,var(--accent) 55%,#fff) 0,transparent 45%),radial-gradient(circle at 85% 70%,color-mix(in srgb,var(--accent) 75%,#000) 0,transparent 55%),linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 30%,#120f14))}
.hero-title{font-size:clamp(44px,9vw,108px);line-height:.92;margin:0 0 18px;text-wrap:balance}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:15.5px;font-weight:500;margin-bottom:14px}
.hero-meta span{display:inline-flex;align-items:center;gap:7px}
.hero-desc{max-width:560px;font-size:16.5px;margin-bottom:22px;opacity:.9}
.hero-actions{flex-wrap:wrap;margin-top:6px}
/* cover */
.hero-cover{position:relative;min-height:min(82vh,700px);display:flex;align-items:flex-end;overflow:hidden;color:#fff;background:#111}
.hero-cover .hbg{transform:scale(1.04);animation:kb 26s ease-in-out infinite alternate}
.hero-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.1) 35%,rgba(0,0,0,.75))}
.tpl-festa .hero-cover::after{background:linear-gradient(180deg,rgba(11,10,16,.35),rgba(11,10,16,.25) 35%,var(--bg))}
.tpl-festa .hero-title{text-shadow:0 0 40px color-mix(in srgb,var(--accent) 70%,transparent);font-size:clamp(52px,12vw,140px);line-height:.95}
.hero-cover .hero-in{position:relative;z-index:1;padding-top:calc(90px + var(--sat));padding-bottom:46px;width:100%}
@keyframes kb{to{transform:scale(1.13) translate(-1%,-1%)}}
/* centered */
.hero-centered{position:relative;min-height:min(88vh,780px);display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden;background:#222}
.hero-centered::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(20,14,8,.35),rgba(20,14,8,.65))}
.hero-centered .hero-in{position:relative;z-index:1;padding:calc(80px + var(--sat)) 20px 70px;max-width:900px}
.hero-centered .hero-title{font-size:clamp(50px,10vw,120px);font-style:italic;line-height:.95;margin:6px auto 18px}
.hero-centered .hero-meta,.hero-centered .hero-actions{justify-content:center}
.hero-centered .hero-desc{margin:0 auto 22px;font-family:'Cormorant Garamond',serif;font-size:21px;font-style:italic}
.orn{display:flex;align-items:center;gap:14px;justify-content:center;font-size:13px;letter-spacing:.3em;text-transform:uppercase;font-weight:600}
.orn::before,.orn::after{content:"";width:48px;height:1px;background:currentColor;opacity:.7}
/* arch */
.hero-arch{padding:calc(56px + var(--sat)) 0 30px}
.hero-arch .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero-arch .hero-title{font-size:clamp(64px,10vw,132px);line-height:1;margin-bottom:10px;color:var(--accent)}
.hero-arch .himg{aspect-ratio:3/4;border-radius:999px 999px 28px 28px;background:var(--accent) center/cover;box-shadow:0 30px 60px -30px rgba(80,30,40,.45);outline:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:12px;max-width:440px;width:100%;justify-self:center}
.hero-arch .eyebrow{font-family:'Cormorant Garamond',serif;font-size:16px;letter-spacing:.3em}
/* split */
.hero-split{padding:calc(54px + var(--sat)) 0 30px}
.hero-split .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.hero-split .himg{aspect-ratio:4/5;background:var(--accent) center/cover}
.hero-split .hero-title{font-size:clamp(44px,7vw,92px)}
/* polaroid */
.hero-polaroid{padding:calc(56px + var(--sat)) 0 30px}
.hero-polaroid .wrap{display:grid;grid-template-columns:auto 1fr;gap:64px;align-items:center}
.pframe{background:#fff;padding:14px 14px 58px;box-shadow:0 22px 44px -18px rgba(60,40,10,.45);transform:rotate(-4deg);width:min(370px,78vw);position:relative;justify-self:center}
.pframe::before{content:"";position:absolute;top:-16px;left:50%;width:120px;height:32px;background:rgba(255,250,235,.7);transform:translateX(-50%) rotate(3deg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pframe .himg{aspect-ratio:1;background:var(--accent) center/cover}
.pframe span{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-family:'Caveat',cursive;font-size:26px;color:#3a342c}
.hero-polaroid .hero-title{font-size:clamp(58px,9vw,118px);line-height:.95}
@media(max-width:820px){
  .hero-arch .wrap,.hero-split .wrap,.hero-polaroid .wrap{grid-template-columns:1fr;gap:30px;text-align:center}
  .hero-arch .himg{order:-1;max-width:300px}
  .hero-split .himg{order:-1;aspect-ratio:4/3;margin:0 -20px}
  .hero-polaroid .pframe{order:-1}
  .hero-arch .hero-meta,.hero-split .hero-meta,.hero-polaroid .hero-meta,.hero-arch .hero-actions,.hero-split .hero-actions,.hero-polaroid .hero-actions{justify-content:center}
  .hero-arch .hero-desc,.hero-split .hero-desc,.hero-polaroid .hero-desc{margin-left:auto;margin-right:auto}
  .hero-split{padding-top:0}
}
/* contagem */
.cd{display:inline-flex;gap:8px;margin:4px 0 20px}
.cd div{min-width:64px;padding:10px 8px;border-radius:14px;text-align:center;background:color-mix(in srgb,var(--ink) 7%,transparent);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.cd b{display:block;font-family:var(--tfont);font-weight:var(--tweight);font-size:28px;line-height:1}
.cd span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.75;font-weight:600}
.hero-cover .cd div,.hero-centered .cd div{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.25);backdrop-filter:blur(10px)}
.cd.today{font-weight:700;font-size:18px;padding:10px 16px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.tpl-romantico .cd b,.tpl-polaroid .cd b{font-family:var(--display);font-weight:700}

/* navegação do álbum */
.gnav{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--line);padding-top:var(--sat)}
.gnav-in{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.gnav .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 0;flex:1;min-width:0}
@media(max-width:959px){.gnav .live{display:none}}
.gnav .chips::-webkit-scrollbar{display:none}
.gnav-act{display:none;gap:8px;flex:none}
@media(min-width:960px){.gnav-act{display:flex}}
.live{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex:none}
.live i{width:8px;height:8px;border-radius:50%;background:#12b76a;animation:pulse 2s infinite}
.live.err i{background:#f79009;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,183,106,.6)}70%{box-shadow:0 0 0 8px rgba(18,183,106,0)}100%{box-shadow:0 0 0 0 rgba(18,183,106,0)}}
.gmain{padding-top:10px;padding-bottom:calc(110px + var(--sab))}
@media(min-width:960px){.gmain{padding-bottom:60px}.gtab{display:none}}
.sec{margin:22px 0 10px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-t h2{font-size:clamp(26px,3.6vw,40px)}
.tpl-romantico .sec-t h2{font-size:clamp(36px,5vw,56px);color:var(--accent)}
.tpl-classico .sec-t h2{font-style:italic}
.sec-t a,.sec-t button{font-size:14px;font-weight:600;color:var(--accent);background:none;border:0;text-decoration:none;white-space:nowrap}
.gfoot{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 40px}
.newpill{position:fixed;top:calc(74px + var(--sat));left:50%;transform:translateX(-50%);z-index:70;box-shadow:0 12px 30px -8px rgba(0,0,0,.35);animation:tin .3s}
.gempty{text-align:center;padding:50px 20px 70px}
.gempty h2{font-size:28px;margin-bottom:8px}.gempty p{color:var(--muted);margin-bottom:22px}

/* grades de fotos */
.pgrid{padding:6px 0 30px}
.tile{position:relative;display:block;width:100%;border:0;padding:0;background:var(--soft);cursor:zoom-in;overflow:hidden;border-radius:var(--tile-r);text-align:left;color:inherit;font:inherit}
.ph{display:block;overflow:hidden;background:var(--soft);border-radius:inherit}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s,transform .6s cubic-bezier(.2,.8,.2,1)}
.ph img.ld{opacity:1}
.tile:hover .ph img{transform:scale(1.05)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0 0 var(--tile-r) var(--tile-r)}
.cap:empty{display:none}
.tile:hover .cap{opacity:1}
.tile.new{animation:pop .7s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.g-mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));grid-auto-rows:var(--row);grid-auto-flow:dense;gap:10px}
.g-mosaic .tile{grid-row:span 2}.g-mosaic .tile.w2{grid-column:span 2}
.g-mosaic .ph{position:absolute;inset:0}
.g-masonry{column-count:4;column-gap:14px}
.g-masonry .tile{margin-bottom:14px;break-inside:avoid}
.g-masonry .ph{aspect-ratio:var(--ar)}
.tpl-classico .g-masonry .tile{padding:8px;background:var(--card);box-shadow:0 12px 26px -16px rgba(60,40,20,.45)}
.tpl-classico .g-masonry .cap{left:8px;right:8px;bottom:8px}
.g-square{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.g-square .ph{aspect-ratio:1}

.tpl-minimal .note{border-radius:0;box-shadow:none}
.wall-cta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 20px;margin-bottom:18px}

.lb{position:fixed;inset:0;z-index:300;background:rgba(10,9,8,.96);color:#fff;display:grid;grid-template-rows:auto 1fr auto;animation:fade .2s;touch-action:pan-y}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0;padding-top:calc(12px + var(--sat))}

const DB = {
  _p: null, mem: { kv: new Map(), events: new Map(), items: new Map(), queue: new Map(), assets: new Map() },
  open() {
    if (this._p) return this._p;
    this._p = new Promise(res => {
      let r;
      try { r = indexedDB.open('fotoevento', 2); } catch { return res(null); }
      r.onupgradeneeded = () => {
        const d = r.result, has = n => d.objectStoreNames.contains(n);
        if (has('photos')) d.deleteObjectStore('photos');
        if (!has('kv')) d.createObjectStore('kv');
        if (!has('events')) d.createObjectStore('events', { keyPath: 'id' });
        if (!has('items')) d.createObjectStore('items', { keyPath: 'key' }).createIndex('eventId', 'eventId');
        if (!has('queue')) d.createObjectStore('queue', { keyPath: 'qid', autoIncrement: true }).createIndex('eventId', 'eventId');
        if (!has('assets')) d.createObjectStore('assets', { keyPath: 'key' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => { console.warn('IndexedDB indisponível', r.error); res(null); };
      r.onblocked = () => res(null);
    });
    return this._p;
  },
  async run(store, mode, fn) {
    const d = await this.open();
    if (!d) return fn(null);
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const r = fn(t.objectStore(store)); let out;
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  _key(store, v) { return store === 'events' ? v.id : (store === 'items' || store === 'assets') ? v.key : v.qid; },
  async get(store, key) {
    if (!(await this.open())) return this.mem[store].get(key);
    return this.run(store, 'readonly', s => s.get(key)).catch(() => undefined);
  },
  async put(store, val, key) {
    if (!(await this.open())) { if (store === 'queue' && val.qid == null) val.qid = Date.now() + Math.random(); this.mem[store].set(key !== undefined ? key : this._key(store, val), val); return; }
    return this.run(store, 'readwrite', s => key !== undefined ? s.put(val, key) : s.put(val)).catch(e => console.warn('IDB put', e));
  },
  async del(store, key) {
    if (!(await this.open())) { this.mem[store].delete(key); return; }
    return this.run(store, 'readwrite', s => s.delete(key)).catch(() => {});
  },
  async all(store) {
    if (!(await this.open())) return [...this.mem[store].values()];
    return this.run(store, 'readonly', s => s.getAll()).catch(() => []);
  },
  async byIndex(store, idx, val) {
    if (!(await this.open())) return [...this.mem[store].values()].filter(x => x[idx] === val);
    return this.run(store, 'readonly', s => s.index(idx).getAll(val)).catch(() => []);
  },
};

/* ---------------- GitHub Gist API ---------------- */
class GH {
  constructor(token) { this.token = token; this.etag = null; this.multiPage = false; }
  async req(path, { method = 'GET', body, etag, light = false } = {}) {
    const headers = { Accept: 'application/vnd.github+json' };
    if (this.token) headers.Authorization = 'Bearer ' + this.token;
    if (etag) headers['If-None-Match'] = etag;
    const opts = { method, headers, cache: 'no-store' };
    if (body !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    for (let attempt = 0; attempt < 3; attempt++) {
      const ctrl = new AbortController(); opts.signal = ctrl.signal;
      let r;
      try { r = await fetch('https://api.github.com' + path, opts); }
      catch (e) {
        if (attempt < 2) { await sleep(1500 * (attempt + 1)); continue; }
        throw new AppError('Sem conexão com o servidor. Verifique sua internet.', 'net');
      }
      if (r.status === 304) return { notModified: true };
      if (r.ok) {
        if (light || r.status === 204) { try { ctrl.abort(); } catch {} return { data: null }; }
        return { data: await r.json(), etag: r.headers.get('ETag') };
      }
      const ra = r.headers.get('Retry-After'), rem = r.headers.get('X-RateLimit-Remaining');
      if ((r.status === 403 || r.status === 429) && ra && attempt < 2) { await sleep(Math.min(+ra || 5, 60) * 1000); continue; }
      if (r.status >= 500 && attempt < 2) { await sleep(2000 * (attempt + 1)); continue; }
      let msg = ''; try { msg = (await r.json()).message || ''; } catch {}
      if (r.status === 401) throw new AppError('Chave de acesso inválida ou expirada.', 'auth');
      if ((r.status === 403 || r.status === 429) && rem === '0') throw new AppError('Limite de acessos do GitHub atingido. Aguarde alguns minutos.', 'rate');
      if (r.status === 403) throw new AppError('Acesso negado pelo GitHub. ' + msg, 'forbidden');
      if (r.status === 404) throw new AppError('Não encontrado. O evento pode ter sido excluído.', '404');
      throw new AppError(`Erro do GitHub (${r.status}). ${msg}`, 'http');
    }
  }
  async listGists(useEtag = false) {
    const all = [];
    for (let page = 1; page <= 15; page++) {
      const res = await this.req(`/gists?per_page=100&page=${page}`, { etag: page === 1 && useEtag && !this.multiPage ? this.etag : null });
      if (res.notModified) return null;
      if (page === 1) this.etag = res.etag;
      all.push(...res.data);
      if (res.data.length < 100) { this.multiPage = page > 1; break; }
    }
    return all;
  }
  async user() { return (await this.req('/user')).data; }
  async create(description, files) { return (await this.req('/gists', { method: 'POST', body: { description, public: false, files } })).data; }
  async update(id, body) { await this.req('/gists/' + id, { method: 'PATCH', body, light: true }); }
  async remove(id) { await this.req('/gists/' + id, { method: 'DELETE', light: true }); }
}

async function compressImage(file, max = 1600, quality = 0.82, limit = 850000) {

    for (let round = 0; round < 4; round++) {

      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);

  } finally { URL.revokeObjectURL(url); }

async function processQueue(sync, onProgress) {
  const items = (await DB.byIndex('queue', 'eventId', sync.id)).sort((a, b) => a.created - b.created);
  if (!items.length) return 0;
  await sync.refresh({ force: true });
  const batches = []; let cur = [], size = 0;
  for (const it of items) {
    if (cur.length && (size + it.content.length > MAX_BATCH_BYTES || cur.length >= 10)) { batches.push(cur); cur = []; size = 0; }
    cur.push(it); size += it.content.length;
  }
  if (cur.length) batches.push(cur);
  let done = 0; onProgress && onProgress(0, items.length);
  for (const b of batches) {
    const files = Object.fromEntries(b.map(it => [it.name, { content: it.content }]));
    const target = sync.pickTarget(b.length);
    if (target) { await sync.gh.update(target.id, { files }); target.count += b.length; }
    else {
      const g = await sync.gh.create(`${TAG_PART(sync.id)} ${sync.meta ? sync.meta.nome : ''}`.trim(), files);
      sync.gists.push({ id: g.id, created: g.created_at || new Date().toISOString(), main: false, count: b.length });
    }
    for (const it of b) await DB.del('queue', it.qid);
    done += b.length; onProgress && onProgress(done, items.length);
  }
  return done;
}

function makePicker({ list, max = 1600, quality = 0.82, limit = 850000, onChange }) {
  return async files => {
    files = [...files].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name));
    if (!files.length) return;
    if (list.length + files.length > 60) { toast('Envie no máximo 60 fotos por vez.', 'err'); files = files.slice(0, Math.max(0, 60 - list.length)); }
    const added = files.map(f => ({ id: rand() + rand(), file: f, status: 'processing' }));
    list.push(...added); onChange();
    await pool(added, 2, async it => {
      try { Object.assign(it, await compressImage(it.file, max, quality, limit), { status: 'ready' }); }
      catch (e) { it.status = 'error'; toast(`Não foi possível ler "${it.file.name}". ${e.message}`, 'err'); }
      it.file = null; onChange();
    });
  };
}
const previewsHTML = list => list.map(it => `<div class="pv ${it.status === 'error' ? 'err' : ''}">${it.data ? `<img src="${it.data}" alt="">` : ''}${it.status === 'processing' ? '<div class="st"><div class="spinner"></div></div>' : ''}<button class="rm" data-rm="${it.id}" aria-label="Remover">${ic('x', 15)}</button></div>`).join('');
function bindDrop(zone, onFiles) {
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('dragover'); onFiles(e.dataTransfer.files); });
}

function heroHTML(m, upHref) {
  const t = TEMPLATES[m.template] || TEMPLATES.moderno, T = TIPOS[m.tipo] || TIPOS.outro;
  const eyebrow = esc(m.anfitrioes && m.anfitrioes !== m.nome ? m.anfitrioes : T.nome);
  const metaL = `<div class="hero-meta">${m.data ? `<span>${ic('cal', 18)} ${esc(fmtDate(m.data))}${m.hora ? ' · ' + esc(m.hora) : ''}</span>` : ''}${m.local ? `<span>${ic('pin', 18)} ${esc(m.local)}</span>` : ''}</div>`;
  const desc = m.descricao ? `<p class="hero-desc">${esc(m.descricao)}</p>` : '';
  const acts = glass => `<div class="row hero-actions">${m.aberto ? `<a class="btn lg" href="${upHref}">${ic('camera')} Enviar minhas fotos</a>` : ''}<button class="btn lg ${glass ? 'glass' : 'ghost'}" data-a="tv">${ic('play')} Telão</button></div>`;
  const cd = `<div data-cd></div>`;
  const title = `<h1 class="ttl hero-title">${esc(m.nome)}</h1>`;
  switch (t.hero) {
    case 'centered': return `<section class="hero-centered"><div class="hbg" data-asset="capa"></div><div class="hero-in"><p class="orn">${eyebrow}</p>${title}${metaL}${desc}${cd}${acts(true)}</div></section>`;
    case 'arch': return `<section class="hero-arch"><div class="wrap"><div><p class="eyebrow">${eyebrow}</p>${title}${metaL}${desc}${cd}${acts(false)}</div><div class="himg" data-asset="capa"></div></div></section>`;
    case 'split': return `<section class="hero-split"><div class="wrap"><div><p class="eyebrow">${eyebrow}</p>${title}${metaL}${desc}${cd}${acts(false)}</div><div class="himg" data-asset="capa"></div></div></section>`;
    case 'polaroid': return `<section class="hero-polaroid"><div class="wrap"><div class="pframe"><div class="himg" data-asset="capa"></div><span>${esc(fmtDate(m.data) || T.nome)}</span></div><div><p class="eyebrow">${eyebrow}</p>${title}${metaL}${desc}${cd}${acts(false)}</div></div></section>`;
    default: return `<section class="hero-cover"><div class="hbg" data-asset="capa"></div><div class="wrap hero-in"><p class="eyebrow light">${eyebrow}</p>${title}${metaL}${desc}${cd}${acts(true)}</div></section>`;
  }
}

async function Gallery(id, tok) {
  const sync = getSync(id, tok);
  await sync.loadCache();
  const L = links(id, tok, baseHere()), enc = encTok(tok), upHref = `#/up/${id}/${enc}`;
  let view = 'album', grid = null, drawn = false, initial = true;

  function draw() {
    const m = sync.meta; if (!m) return;
    applyEventLook(m, sync.assets); document.title = m.nome;
    const tpl = TEMPLATES[m.template] || TEMPLATES.moderno;
    app.innerHTML = `${heroHTML(m, upHref)}
      <nav class="gnav"><div class="wrap gnav-in"><div class="chips" id="gTabs"></div>
        <div class="gnav-act">${m.aberto ? `<a class="btn sm" href="${upHref}">${ic('camera', 16)} Enviar fotos</a>` : ''}<button class="btn sm ghost" data-a="more">${ic('more', 16)} Mais</button></div>
        <span class="live" id="live"><i></i><span>Ao vivo</span></span></div></nav>
      <main class="wrap gwrap gmain" id="gView"></main>
      <p class="gfoot">Feito com carinho · ${esc(m.nome)}</p>
      <nav class="tabbar gtab">
        <button class="tab-item" data-v="album"><span class="tb-ic">${ic('images', 22)}</span><span>Álbum</span></button>
        ${m.recados ? `<button class="tab-item" data-v="recados"><span class="tb-ic">${ic('msg', 22)}</span><span>Recados</span></button>` : ''}
        ${m.aberto ? `<a class="tab-item primary" href="${upHref}"><span class="tb-ic">${ic('camera', 24)}</span><span>Enviar</span></a>` : ''}
        <button class="tab-item" data-a="tv"><span class="tb-ic">${ic('play', 22)}</span><span>Telão</span></button>
        <button class="tab-item" data-a="more"><span class="tb-ic">${ic('more', 22)}</span><span>Mais</span></button>
      </nav>`;
    paintAssets(app, sync.assets); startCountdown(m);
    drawn = true; drawView(true);
  }
  function onClick(e) {
    const a = e.target.closest('[data-a]')?.dataset.a, v = e.target.closest('[data-v]')?.dataset.v;
    if (v) { view = v; drawView(true); $('.gnav')?.scrollIntoView({ behavior: 'smooth' }); return; }
    if (a === 'tv') openSlideshow(sync, L.up);
    if (a === 'more') moreSheet();
  }
  function moreSheet() {
    const items = [
      { icon: 'share', label: 'Compartilhar álbum', sub: 'Envie o link para outros convidados', fn: () => shareLink(sync.meta.nome, `Veja as fotos de ${sync.meta.nome}`, L.e) },
      { icon: 'download', label: 'Baixar todas as fotos', sub: 'Arquivo ZIP', fn: () => downloadZip(sync, true) },
      { icon: 'play', label: 'Modo telão', sub: 'Apresentação em tela cheia', fn: () => openSlideshow(sync, L.up) },
    ];
    if (!isStandalone()) items.unshift({ icon: 'inst', label: 'Instalar como app', sub: 'Acesso rápido pela tela inicial', fn: installApp });
    if (sync.meta.recados) items.push({ icon: 'msg', label: 'Deixar um recado', fn: () => { location.hash = upHref + '/recado'; } });
    actionSheet('Mais opções', items);
  }
  function drawTabs() {
    const m = sync.meta, nF = sync.visible('foto').length, nP = sync.visible('previa').length, nR = sync.visible('recado').length;
    const tabs = [['album', 'Álbum', nF + nP], ...(nP ? [['previa', m.albumPrevia, nP]] : []), ...(m.recados ? [['recados', 'Recados', nR]] : [])];
    $('#gTabs').innerHTML = tabs.map(([k, l, n]) => `<button class="chip ${view === k ? 'on' : ''}" data-v="${k}">${esc(l)} <small>${n}</small></button>`).join('');
    $$('.gtab [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === view || (view === 'previa' && b.dataset.v === 'album')));
  }
  function drawView(rebuild) {
    const box = $('#gView'); if (!box) return;
    const m = sync.meta, tpl = TEMPLATES[m.template] || TEMPLATES.moderno;
    drawTabs();
    const fotos = sync.visible('foto'), prev = sync.visible('previa');
    if (view === 'recados') {
      const notes = sync.visible('recado');
      box.innerHTML = `<section class="sec"><div class="sec-t"><h2 class="ttl">Mural de recados</h2></div>
        ${m.aberto ? `<div class="card wall-cta"><div><b>Deixe seu recado</b><p class="muted small">Uma mensagem carinhosa aparece aqui e no telão.</p></div><a class="btn" href="${upHref}/recado">${ic('msg', 18)} Escrever recado</a></div>` : ''}
        ${notes.length ? wallHTML(notes) : `<div class="gempty"><p>Nenhum recado ainda.</p></div>`}</section>`;
      grid = null; return;
    }
    const list = view === 'previa' ? prev : fotos;
    if (rebuild || !grid) {
      box.innerHTML = `${view === 'album' && prev.length ? `<section class="sec"><div class="sec-t"><h2 class="ttl">${esc(m.albumPrevia)}</h2><button data-v="previa">Ver todas (${prev.length}) →</button></div><div class="strip" id="strip"></div></section>` : ''}
        <section class="sec"><div class="sec-t"><h2 class="ttl">${view === 'previa' ? esc(m.albumPrevia) : 'Fotos dos convidados'}</h2>${view === 'previa' ? `<button data-v="album">← Voltar ao álbum</button>` : ''}</div><div id="grid"></div><div id="gEmpty"></div></section>`;
      grid = new PhotoGrid($('#grid'), tpl.grid, key => { const l = view === 'previa' ? sync.visible('previa') : sync.visible('foto'); openLightbox(l, l.findIndex(p => p.key === key)); });
      grid.animate = !initial;
    }
    grid.update(list);
    const strip = $('#strip');
    if (strip) {
      strip.innerHTML = prev.map(p => `<button class="tile" data-key="${p.key}" style="--ar:${((p.w && p.h) ? p.w / p.h : .75).toFixed(3)}"><span class="ph"><img src="${itemURL(p)}" alt="" onload="this.classList.add('ld')"></span></button>`).join('');
      strip.onclick = e => { const t = e.target.closest('.tile'); if (t) { const l = sync.visible('previa'); openLightbox(l, l.findIndex(p => p.key === t.dataset.key)); } };
    }
    $('#gEmpty').innerHTML = list.length ? '' : (sync.loaded ? `<div class="gempty"><h2 class="ttl">O álbum está esperando você</h2><p>Ainda não há fotos por aqui. ${m.aberto ? 'Que tal enviar as primeiras?' : ''}</p>${m.aberto ? `<a class="btn lg" href="${upHref}">${ic('camera')} Enviar fotos</a>` : ''}</div>` : `<div class="gempty"><div class="spinner"></div></div>`);
  }
  const redraw = throttle(() => drawn && drawView(false), 200);
  sync.on('meta', () => { if (drawn) draw(); });
  sync.on('assets', () => { if (drawn) { applyEventLook(sync.meta, sync.assets); paintAssets(app, sync.assets); } });
  sync.on('item', redraw);
  sync.on('items', added => {
    if (!drawn) return; drawView(view === 'recados');
    const n = added.filter(p => p.kind !== 'recado' && itemStatus(sync.meta, p) === 'visivel').length;
    if (!initial && n && window.scrollY > 400 && !$('.newpill')) {
      const b = document.createElement('button'); b.className = 'btn newpill';
      b.innerHTML = `${ic('sparkle', 18)} ${plural(n, 'nova foto', 'novas fotos')}`;
      b.onclick = () => { b.remove(); $('.gnav')?.scrollIntoView({ behavior: 'smooth' }); };
      document.body.appendChild(b); setTimeout(() => b.remove(), 9000); state.cleanup.push(() => b.remove());
    }
  });
  const setLive = ok => { const l = $('#live'); if (l) { l.classList.toggle('err', !ok); l.lastElementChild.textContent = ok ? 'Ao vivo' : 'Reconectando'; } };
  app.addEventListener('click', onClick);
  state.cleanup.push(() => app.removeEventListener('click', onClick));

  if (sync.meta) draw(); else { applySysLook(); app.innerHTML = loadingScreen('Abrindo o álbum…'); }
  try { await sync.refresh({ force: true }); if (!drawn) draw(); else drawView(false); setLive(true); }
  catch (e) {
    if (!drawn) { app.innerHTML = msgScreen('alert', e.code === '404' ? 'Evento não encontrado' : 'Não foi possível abrir o álbum', e.message, `<button class="btn" onclick="location.reload()">${ic('refresh')} Tentar novamente</button>`); return; }
    toast(e.message, 'err'); setLive(false);
  }
  initial = false; if (grid) grid.animate = true;
  startPolling(async () => { try { await sync.refresh(); setLive(true); } catch (e) { setLive(false); throw e; } });
}

/* =====================================================================
   ENVIO DE FOTOS E RECADOS  (#/up/<id>/<chave>[/recado])
   ===================================================================== */
async function Upload(id, tok, mode) {
  const sync = getSync(id, tok, true);
  await sync.loadCache();
  const enc = encTok(tok), items = [];
  let sending = false, drawn = false;
  const guestName = (await DB.get('kv', 'guestName')) || '';
  const pick = makePicker({ list: items, onChange: () => drawPreviews() });

  function draw() {
    const m = sync.meta; if (!m) return;
    applyEventLook(m, sync.assets); document.title = 'Enviar fotos · ' + m.nome; drawn = true;
    if (!m.aberto) { app.innerHTML = msgScreen('lock', 'Envio encerrado', `O envio de fotos para "${m.nome}" foi encerrado. Você ainda pode ver o álbum.`, `<a class="btn" href="#/e/${id}/${enc}">${ic('images')} Ver álbum</a>`); return; }
    app.innerHTML = `<div class="up">
      <header class="up-hero"><div class="hbg" data-asset="capa"></div><div class="up-hero-in"><p class="eyebrow light">${mode === 'recado' ? 'Deixe seu recado' : 'Envie suas fotos'}</p><h1 class="ttl">${esc(m.nome)}</h1>${dateLine(m) ? `<p class="sub">${esc(dateLine(m))}</p>` : ''}</div></header>
      <main class="up-main"><div class="card up-card" id="upCard"></div><p class="up-foot"><a href="#/e/${id}/${enc}">${ic('images', 16)} Ver o álbum do evento →</a></p></main>
      <div class="sendbar" id="sendbar" hidden><button class="btn lg block" id="sendBtn"></button></div></div>`;
    paintAssets(app, sync.assets);
    $('#sendBtn').onclick = send;
    drawForm();
  }
  function drawForm() {
    const m = sync.meta;
    $('#upCard').innerHTML = `${m.mensagem ? `<p class="up-msg">${esc(m.mensagem)}</p>` : ''}<div id="pending"></div>
      <div class="field"><label class="f" for="gName">Seu nome <span class="opt">(opcional)</span></label><input id="gName" maxlength="60" autocomplete="name" placeholder="Como você quer aparecer no álbum" value="${esc(guestName)}"></div>
      <div class="field"><label class="f" for="gMsg">${m.recados ? 'Recado para o mural' : 'Mensagem'} <span class="opt">(opcional)</span></label><textarea id="gMsg" rows="${mode === 'recado' ? 4 : 2}" maxlength="400" placeholder="${m.recados ? 'Escreva uma mensagem carinhosa — ela aparece no mural e no telão' : 'Deixe uma mensagem junto com as fotos'}"></textarea></div>
      <div class="pick-row">
        <label class="drop">${ic('camera', 30)}<span>Tirar foto</span><input class="sr" type="file" accept="image/*" capture="environment" id="inCam"></label>
        <label class="drop" id="dz">${ic('images', 30)}<span>Escolher da galeria</span><input class="sr" type="file" accept="image/*" multiple id="inGal"></label>
      </div><div class="previews" id="previews"></div>`;
    $('#inCam').onchange = e => { pick(e.target.files); e.target.value = ''; };
    $('#inGal').onchange = e => { pick(e.target.files); e.target.value = ''; };
    $('#gName').oninput = e => DB.put('kv', e.target.value.trim(), 'guestName');
    $('#gMsg').oninput = () => drawPreviews();
    bindDrop($('#dz'), pick);
    $('#previews').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (!b || sending) return; const k = items.findIndex(x => x.id === b.dataset.rm); if (k >= 0) items.splice(k, 1); drawPreviews(); });
    if (mode === 'recado') setTimeout(() => $('#gMsg')?.focus(), 200);
    drawPreviews(); drawPending();
  }
  async function drawPending() {
    const n = await pendingCount(id), box = $('#pending'); if (!box) return;
    box.innerHTML = n ? `<div class="alert" style="margin-bottom:18px">${ic('alert')}<div><b>${plural(n, 'envio pendente', 'envios pendentes')}.</b> A conexão caiu da última vez. <a href="#" id="retryQ" style="font-weight:700">Enviar agora</a></div></div>` : '';
    const r = $('#retryQ'); if (r) r.onclick = e => { e.preventDefault(); send(); };
  }
  function drawPreviews() {
    const box = $('#previews'); if (!box) return;
    box.innerHTML = previewsHTML(items);
    const ready = items.filter(i => i.status === 'ready').length, proc = items.some(i => i.status === 'processing');
    const msg = ($('#gMsg')?.value || '').trim(), bar = $('#sendbar'), btn = $('#sendBtn');
    bar.hidden = !items.length && !(msg && sync.meta.recados);
    btn.disabled = proc || sending || (!ready && !(msg && sync.meta.recados));
    btn.innerHTML = proc ? 'Preparando fotos…' : ready ? `${ic('upload')} Enviar ${plural(ready, 'foto')}${msg && sync.meta.recados ? ' + recado' : ''}` : `${ic('msg')} Enviar recado`;
  }
  async function send() {
    if (sending) return;
    const autor = ($('#gName')?.value || '').trim().slice(0, 60), msg = ($('#gMsg')?.value || '').trim().slice(0, 400);
    const ready = items.filter(i => i.status === 'ready');
    await enqueue(sync, ready, { prefix: 'f', autor, msg, recado: sync.meta.recados });
    if (!(await pendingCount(id))) return;
    sending = true; drawPreviews();
    try {
      const n = await runSend(sync, ready.length ? 'Enviando fotos…' : 'Enviando recado…');
      items.length = 0;
      const nf = ready.length, sent = ((await DB.get('kv', 'sent_' + id)) || 0) + nf; await DB.put('kv', sent, 'sent_' + id);
      $('#sendbar').hidden = true;
      $('#upCard').innerHTML = `<div class="done"><div class="okc">${ic('check', 38)}</div><h2 class="ttl">${nf ? 'Fotos enviadas!' : 'Recado enviado!'}</h2>
        <p>${nf ? `${plural(nf, 'foto')} já ${nf > 1 ? 'estão' : 'está'} no álbum.` : 'Seu recado já está no mural.'} Obrigado por compartilhar! 💛${nf ? `<br><small>Você já enviou ${plural(sent, 'foto')} para este evento.</small>` : ''}</p>
        <div class="row"><button class="btn" id="more">${ic('camera')} Enviar mais</button><a class="btn ghost" href="#/e/${id}/${enc}">${ic('images')} Ver álbum</a></div></div>`;
      $('#more').onclick = () => { mode = ''; drawForm(); };
    } catch (e) {
      toast(e.code === 'net' ? 'Sem conexão. Tudo ficou salvo no aparelho e será enviado quando a internet voltar.' : e.message, 'err');
      items.splice(0, items.length, ...items.filter(i => i.status !== 'ready'));
      drawPending();
    } finally { sending = false; if ($('#sendBtn')) drawPreviews(); }
  }
  sync.on('meta', () => { if (!drawn || (!items.length && !sending)) draw(); });
  sync.on('assets', () => { if (drawn) { applyEventLook(sync.meta, sync.assets); paintAssets(app, sync.assets); } });
  if (sync.meta) draw(); else { applySysLook(); app.innerHTML = loadingScreen('Abrindo evento…'); }
  try { await sync.refresh({ force: true }); if (!drawn) draw(); }
  catch (e) { if (!drawn) { app.innerHTML = msgScreen('alert', e.code === '404' ? 'Evento não encontrado' : 'Não foi possível abrir', e.message, `<button class="btn" onclick="location.reload()">${ic('refresh')} Tentar novamente</button>`); return; } }
  const onOnline = async () => { if (!sending && (await pendingCount(id))) send(); };
  window.addEventListener('online', onOnline); state.cleanup.push(() => window.removeEventListener('online', onOnline));
}

  const side = [...nav.filter(n => n.primary), ...nav.filter(n => !n.primary)];

    <aside class="side">${sideTop}<nav class="side-nav">${side.map(n => `${navLink(n, 'nav-item')}${ic(n.icon)}<span>${esc(n.label)}</span>${n.badge ? `<span class="badge">${n.badge}</span>` : ''}</a>`).join('')}</nav><div class="side-foot">${sideFoot}</div></aside>
    <div class="main">
      <header class="appbar"><div class="appbar-in">${back ? `<a class="icon-btn" href="${back}" aria-label="Voltar">${ic('back')}</a>` : `<span class="mob-brand">${ic('aperture', 19)}</span>`}
        <div class="ab-title"><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div><div class="row" style="gap:4px">${actions}</div></div><div class="subtabs" id="subtabs"></div></header>
      <div class="content" id="content"></div>
    </div>
    <nav class="tabbar">${nav.map(n => `${navLink(n, 'tab-item')}<span class="tb-ic">${ic(n.icon, 22)}</span><span>${esc(n.short || n.label)}</span></a>`).join('')}</nav>
  </div>`;
}
function bindShell(handlers) { $$('[data-nav]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); handlers[a.dataset.nav]?.(); })); }
function subtabsHTML(tabs, active, hrefFn) { return tabs.map(([k, l, n]) => `<a class="chip ${k === active ? 'on' : ''}" href="${hrefFn(k)}">${esc(l)}${n ? ` <small>${n}</small>` : ''}</a>`).join(''); }

function linkCard(kind, url, m, { hl = false } = {}) {
  const info = {
    up: ['Link para enviar fotos', 'Coloque o QR code nas mesas, convites ou no telão. Os convidados abrem e enviam as fotos.', `📸 ${m.nome}\nEnvie as fotos que você tirar no evento por aqui: ${url}`],
    e: ['Site do evento', 'O álbum com todas as fotos e recados. Compartilhe antes, durante e depois do evento.', `✨ Veja o álbum de fotos de ${m.nome}: ${url}`],
    h: [`Painel dos ${m.hostLabel.toLowerCase()}`, `Envie para ${m.anfitrioes || 'os anfitriões'}: lá eles enviam as fotos da ${m.albumPrevia.toLowerCase()}, personalizam o site e acompanham tudo.`, `Olá${m.anfitrioes ? ', ' + m.anfitrioes : ''}! 💛 Este é o painel de ${m.nome}. Por ele vocês enviam as fotos da ${m.albumPrevia.toLowerCase()}, personalizam o site e acompanham as fotos dos convidados. Dica: instale como app no celular. ${url}`],
  }[kind];

async function moderate(sync, act, file) {
  const rm = (a, v) => { const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); };
  const it = sync.items.get(file); if (!it) return;
  if (act === 'del') {
    await sync.gh.update(it.gistId, { files: { [file]: null } });
    sync.removeLocal(file); toast('Excluído', 'ok'); return;
  }
  const apply = m => {
    if (act === 'approve') { rm(m.ocultas, file); if (!m.aprovadas.includes(file)) m.aprovadas.push(file); }
    if (act === 'hide') { if (!m.ocultas.includes(file)) m.ocultas.push(file); }
    if (act === 'show') { rm(m.ocultas, file); if (m.moderacao && !m.aprovadas.includes(file)) m.aprovadas.push(file); }
  };
  apply(sync.meta); sync.emit('meta', sync.meta);
  await mutateMeta(sync, apply);
}
async function setCoverFromItem(sync, it) {
  const r = await compressImage(it.blob, 1800, 0.82, 800000);
  await setAsset(sync, 'capa', r.data); toast('Capa atualizada!', 'ok');
}

/** Lista de moderação (fotos, prévias ou recados) */
function moderationView(box, sync, role, kind) {
  let filter = 'todas';
  const canDel = role === 'admin' || kind === 'previa';
  const label = { visivel: 'Publicada', pendente: 'Pendente', oculta: 'Oculta' };
  function draw() {
    const m = sync.meta, all = sync.list(kind), by = { todas: all, visivel: [], pendente: [], oculta: [] };
    all.forEach(p => by[itemStatus(m, p)].push(p));
    const tabs = [['todas', 'Todas'], ['visivel', 'Publicadas'], ...((m.moderacao && kind !== 'previa') || by.pendente.length ? [['pendente', 'Pendentes']] : []), ['oculta', 'Ocultas']];
    const list = by[filter] || all;
    const acts = p => { const st = itemStatus(m, p); return `${st === 'pendente' ? `<button class="icon-btn ok" data-act="approve" data-file="${esc(p.file)}" title="Aprovar">${ic('check', 17)}</button>` : ''}${st === 'oculta' ? `<button class="icon-btn" data-act="show" data-file="${esc(p.file)}" title="Mostrar">${ic('eye', 17)}</button>` : `<button class="icon-btn" data-act="hide" data-file="${esc(p.file)}" title="Ocultar">${ic('eyeOff', 17)}</button>`}${kind === 'previa' ? `<button class="icon-btn" data-act="cover" data-file="${esc(p.file)}" title="Usar como capa">${ic('star', 17)}</button>` : ''}${canDel ? `<button class="icon-btn del" data-act="del" data-file="${esc(p.file)}" title="Excluir">${ic('trash', 17)}</button>` : ''}`; };
    box.innerHTML = `<div class="sec-head"><div class="seg" style="margin:0">${tabs.map(([k, l]) => `<button class="${filter === k ? 'on' : ''}" data-f="${k}">${l} <small>${by[k].length}</small></button>`).join('')}</div>
      ${kind !== 'recado' && all.length ? `<button class="btn sm dark" data-zip>${ic('download', 16)} Baixar todas</button>` : ''}</div>
      ${!list.length ? `<div class="empty">${all.length ? 'Nada neste filtro.' : sync.loaded ? (kind === 'recado' ? 'Nenhum recado ainda.' : kind === 'previa' ? 'Nenhuma foto de prévia ainda.' : 'Nenhuma foto recebida ainda. Compartilhe o QR code de envio!') : 'Carregando…'}</div>`
      : kind === 'recado' ? `<div class="nlist">${list.map(r => `<div class="card nitem st-${itemStatus(m, r)}"><blockquote>${esc(r.msg)}</blockquote><footer><span>${esc(r.autor || 'Anônimo')} · ${esc(ago(r.ts))}${itemStatus(m, r) !== 'visivel' ? ` · <b>${label[itemStatus(m, r)]}</b>` : ''}</span><span class="acts">${acts(r)}</span></footer></div>`).join('')}</div>`
      : `<div class="agrid">${list.map(p => { const st = itemStatus(m, p); return `<div class="atile st-${st}"><button class="atile-img" data-open="${esc(p.file)}"><img src="${itemURL(p)}" alt="" loading="lazy"></button>${st !== 'visivel' ? `<span class="badge">${label[st]}</span>` : ''}<div class="atile-bar"><span class="who" title="${esc(p.msg)}">${esc(p.autor || 'Anônimo')}</span><div class="acts">${acts(p)}</div></div></div>`; }).join('')}</div>`}`;
  }
  box.addEventListener('click', async e => {
    const f = e.target.closest('[data-f]'); if (f) { filter = f.dataset.f; return draw(); }
    if (e.target.closest('[data-zip]')) return downloadZip(sync, false, e.target.closest('[data-zip]'));
    const o = e.target.closest('[data-open]'); if (o) { const l = sync.list(kind); return openLightbox(l, l.findIndex(p => p.file === o.dataset.open)); }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, file = b.dataset.file;
    try {
      if (act === 'cover') { b.disabled = true; await setCoverFromItem(sync, sync.items.get(file)); return; }
      if (act === 'del' && !await confirmDlg('Excluir definitivamente?', 'Isso apaga o item do álbum e não pode ser desfeito.', 'Excluir', true)) return;
      await moderate(sync, act, file); draw();
    } catch (err) { toast(err.message, 'err'); draw(); }
  });
  draw();
  return { draw };
}

/** Envio de prévias pelos anfitriões/administrador */

  const m = sync.meta, items = [];

  };

  $('#pvSend', box).onclick = async () => {
    const ready = items.filter(i => i.status === 'ready');

      const n = await runSend(sync, 'Enviando prévia…'); items.length = 0; draw();
      toast(`${plural(n, 'foto enviada', 'fotos enviadas')}!`, 'ok');
      await sync.refresh({ force: true });
      if (!sync.assets.capa) { const first = sync.list('previa')[0]; if (first && await confirmDlg('Usar como capa?', 'O site ainda não tem capa. Quer usar uma foto da prévia?', 'Usar como capa')) await setCoverFromItem(sync, first); }

    if (!w.nome.trim()) return toast('Informe o nome do evento.', 'err');
    const btn = $('#pzSave', box); btn.disabled = true; btn.textContent = 'Salvando…';
    try {
      if (w.fundo.tipo === 'imagem' && !cur('fundo')) { w.fundo.tipo = 'template'; toast('Nenhuma imagem de fundo escolhida — usando o fundo do modelo.'); }
      if (sync.meta.capa && !('capa' in pend) && !sync.assetRaw.capa) pend.capa = sync.meta.capa;
      for (const k of Object.keys(pend)) await setAsset(sync, k, pend[k]);
      const keys = ['nome', 'anfitrioes', 'data', 'hora', 'local', 'descricao', 'mensagem', 'albumPrevia', 'template', 'cor', 'fundo', 'aberto', 'recados', 'contagem', ...(isAdmin ? ['moderacao', 'tipo', 'hostLabel', 'host'] : [])];
      const turningOnMod = isAdmin && w.moderacao && !sync.meta.moderacao;
      await mutateMeta(sync, m => {
        // ao ligar a aprovação, o que já estava publicado continua publicado
        if (turningOnMod && !m.moderacao) sync.list(['foto', 'recado']).forEach(p => { if (!m.aprovadas.includes(p.file)) m.aprovadas.push(p.file); });
        keys.forEach(k => { m[k] = structuredClone(w[k]); }); m.nome = m.nome.trim(); m.capa = '';
      });
      Object.keys(pend).forEach(k => delete pend[k]);
      toast('Alterações salvas! O site já foi atualizado.', 'ok');
    } catch (e) { toast(e.message, 'err'); }
    btn.disabled = false; btn.innerHTML = `${ic('check')} Salvar alterações`;
  };
}

async function Host(id, tok, tab = 'inicio') {

  await sync.loadCache();
  const enc = encTok(tok), L = links(id, tok, baseHere()), base = `#/h/${id}/${enc}`;
  let drawn = false, view = null;
  function nav(m) {
    return [
      { id: 'inicio', label: 'Início', icon: 'home', href: base + '/inicio' },
      { id: 'previa', label: m.albumPrevia, short: 'Prévia', icon: 'images', href: base + '/previa' },

      ...(m.host.personalizar ? [{ id: 'personalizar', label: 'Personalizar site', short: 'Site', icon: 'palette', href: base + '/personalizar' }] : []),
      { id: 'convidar', label: 'Convidar', icon: 'share', href: base + '/convidar' },
    ];
  }
  const pendN = () => sync.list(['foto', 'recado']).filter(p => itemStatus(sync.meta, p) === 'pendente').length;
  function draw() {
    const m = sync.meta; if (!m) return;
    if ((tab === 'fotos' && !m.host.moderar) || (tab === 'personalizar' && !m.host.personalizar)) tab = 'inicio';
    applySysLook(m.cor); setPageBg({ tipo: 'template' }); document.title = `${m.hostLabel} · ${m.nome}`;
    const titles = { inicio: `Olá, ${m.anfitrioes || m.hostLabel.toLowerCase()}!`, previa: m.albumPrevia, fotos: 'Fotos e recados', personalizar: 'Personalizar site', convidar: 'Convidar' };
    app.innerHTML = shellHTML({
      nav: nav(m), active: tab, title: titles[tab], sub: m.nome,
      actions: `<a class="icon-btn" href="${esc(L.e)}" target="_blank" rel="noopener" title="Ver site">${ic('ext')}</a>`,
      sideTop: `<div class="side-event"><div class="sc" data-asset="capa"></div><p class="eyebrow" style="margin:0 0 4px">Painel dos ${esc(m.hostLabel.toLowerCase())}</p><b>${esc(m.nome)}</b></div>`,
      sideFoot: !isStandalone() ? `<button class="btn ghost sm" data-inst>${ic('inst', 16)} Instalar como app</button>` : '',
    });
    paintAssets(app, sync.assets);
    $$('[data-inst]').forEach(b => b.onclick = installApp);
    drawn = true; drawTab();
  }
  function drawTab() {
    const box = $('#content'), m = sync.meta;
    if (tab === 'inicio') {
      const nF = sync.list('foto').length, nP = sync.list('previa').length, nR = sync.list('recado').length, pend = pendN();
      const guests = new Set(sync.list(['foto', 'recado']).map(p => (p.autor || '').toLowerCase()).filter(Boolean)).size;
      const notes = sync.visible('recado').slice(0, 3);
      box.innerHTML = `<div class="card hello" data-asset="capa"><p class="eyebrow light">${esc(TIPOS[m.tipo].nome)}${m.data ? ' · ' + esc(fmtDate(m.data)) : ''}</p><h2>${esc(m.nome)}</h2><div data-cd style="margin-top:8px"></div></div>
        ${pend && m.host.moderar ? `<a class="alert info" href="${base}/fotos" style="margin-bottom:16px;text-decoration:none">${ic('info')}<div><b>${plural(pend, 'item aguardando', 'itens aguardando')} sua aprovação.</b> Toque para revisar.</div></a>` : ''}
        <div class="stats"><div class="card stat"><b>${nF}</b><span>Fotos dos convidados</span></div><div class="card stat"><b>${nP}</b><span>${esc(m.albumPrevia)}</span></div><div class="card stat"><b>${nR}</b><span>Recados</span></div><div class="card stat"><b>${guests}</b><span>Convidados</span></div></div>
        <div class="quick">
          <a class="card qa" href="${base}/previa"><span class="qi">${ic('upload')}</span><span><b>Enviar ${esc(m.albumPrevia.toLowerCase())}</b><small>Fotos em destaque no site</small></span></a>

          <a class="card qa" href="${esc(L.e)}" target="_blank" rel="noopener"><span class="qi">${ic('ext')}</span><span><b>Ver o site</b><small>Como os convidados veem</small></span></a>

          ${m.host.personalizar ? `<a class="card qa" href="${base}/personalizar"><span class="qi">${ic('palette')}</span><span><b>Personalizar</b><small>Modelo, cores, capa e fundo</small></span></a>` : ''}

        </div>
        ${notes.length ? `<div class="sec-head"><h2>Últimos recados</h2>${m.host.moderar ? `<a class="btn sm ghost" href="${base}/fotos">Ver todos</a>` : ''}</div><div class="nlist">${notes.map(r => `<div class="card nitem"><blockquote>${esc(r.msg)}</blockquote><footer><span>${esc(r.autor || 'Anônimo')} · ${esc(ago(r.ts))}</span></footer></div>`).join('')}</div>` : ''}`;

      $$('[data-tv]', box).forEach(b => b.onclick = () => openSlideshow(sync, L.up));
      $$('[data-inst]', box).forEach(b => b.onclick = installApp);
      view = null;

    else if (tab === 'fotos') {
      box.innerHTML = `<div class="seg" id="hk"><button class="on" data-k="foto">Fotos dos convidados</button><button data-k="recado">Recados</button></div><div id="hm"></div>`;
      let mv = moderationView($('#hm', box), sync, 'host', 'foto');
