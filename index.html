      view = mv;
    } else if (tab === 'personalizar') { personalizeView(box, sync, 'host'); view = null; }
    else if (tab === 'convidar') {
      box.innerHTML = `<p class="muted" style="margin-bottom:16px">Compartilhe com os convidados antes e durante o evento. O QR code de envio fica ótimo impresso nas mesas.</p><div class="links">${linkCard('up', L.up, m, { hl: true })}${linkCard('e', L.e, m)}</div>`;
      bindLinkCards(box, m); view = null;
    }
  }
  const redraw = throttle(() => { if (!drawn) return; if (view) view.draw(); else if (tab === 'inicio') drawTab(); }, 400);
  sync.on('meta', () => { if (drawn && tab !== 'personalizar') draw(); });
  sync.on('assets', () => { if (drawn) paintAssets(app, sync.assets); });
  sync.on('items', redraw);
  if (sync.meta) draw(); else { applySysLook(); app.innerHTML = loadingScreen('Abrindo painel…'); }
  try { await sync.refresh({ force: true }); if (!drawn) draw(); else redraw(); }
  catch (e) { if (!drawn) { app.innerHTML = msgScreen('alert', 'Não foi possível abrir o painel', e.message, `<button class="btn" onclick="location.reload()">${ic('refresh')} Tentar novamente</button>`); return; } toast(e.message, 'err'); }
  startPolling(() => sync.refresh(), 30000);
}

async function AdminHome() {
  if (!state.cfg.token) return AdminSetup();
  applySysLook(); document.title = 'Eventos · ' + APP_NAME;
  adminShell('eventos', { title: 'Seus eventos', sub: state.cfg.user ? `Conectado como ${state.cfg.user.login}` : '', actions: `<button class="btn sm" data-new style="margin-left:6px">${ic('plus', 16)} <span>Novo</span></button>` });
  $('[data-new]').onclick = newEventModal;
  const box = $('#content');
  box.innerHTML = `<div class="page-head"><div style="flex:1;max-width:420px"><input id="evQ" placeholder="Buscar evento…" style="border-radius:99px"></div></div><div id="evList" class="ev-grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;
  $('#evQ').oninput = e => { const q = e.target.value.toLowerCase(); $$('.ev-card').forEach(c => c.style.display = c.dataset.name.includes(q) ? '' : 'none'); };
  const render = evs => {
    const el = $('#evList'); if (!el) return;
    evs.sort((a, b) => (b.meta.data || b.meta.criado || '').localeCompare(a.meta.data || a.meta.criado || ''));
    el.innerHTML = evs.length ? evs.map(evCard).join('') : `<div class="empty" style="grid-column:1/-1"><div class="ico-big">${ic('camera', 32)}</div><h3>Nenhum evento ainda</h3><p style="margin-bottom:20px">Crie o primeiro evento para gerar os QR codes e o site.</p><button class="btn" data-new2>${ic('plus')} Criar evento</button></div>`;
    $('[data-new2]')?.addEventListener('click', newEventModal);
  };
  const cached = (await DB.all('events')).filter(e => e.meta && e.owner === state.cfg.user?.login);
  for (const c of cached) { const a = await DB.get('assets', c.id + '|capa'); c.capa = a?.data || c.meta.capa || ''; c.meta = normalizeMeta(c.meta); }
  if (cached.length) render(cached);
  try {
    const list = await new GH(state.cfg.token).listGists();
    const mains = list.filter(g => (g.description || '').startsWith(TAG_MAIN) && g.files['evento.json']);
    const out = [];
    await pool(mains, 4, async g => {
      const parts = list.filter(p => (p.description || '').includes(TAG_PART(g.id)));
      const count = [g, ...parts].reduce((n, x) => n + Object.keys(x.files).filter(n2 => /^[fp]_/.test(n2) && isItem(n2)).length, 0);
      const raw = g.files['evento.json'].raw_url, old = await DB.get('events', g.id);
      let meta = old && old.metaRaw === raw && old.meta ? normalizeMeta(old.meta) : null;
      if (!meta) { try { meta = normalizeMeta(await fetchRaw(raw)); } catch { meta = normalizeMeta({ nome: g.description.slice(TAG_MAIN.length) }); } }
      const craw = g.files['capa.txt']?.raw_url || null, ca = await DB.get('assets', g.id + '|capa');
      let capa = ca && ca.raw === craw ? ca.data : '';
      if (craw && (!ca || ca.raw !== craw)) { try { capa = await fetchRaw(craw, false); await DB.put('assets', { key: g.id + '|capa', raw: craw, data: capa }); } catch {} }
      if (!craw) capa = meta.capa || '';
      const ev = { ...(old || {}), id: g.id, meta, metaRaw: raw, count, owner: state.cfg.user?.login };
      await DB.put('events', ev); out.push({ ...ev, capa });
    });
    for (const c of cached) if (!out.find(o => o.id === c.id)) await DB.del('events', c.id);
    render(out);
  } catch (e) {
    toast(e.message, 'err');
    if (e.code === 'auth') { state.cfg.token = null; await DB.del('kv', 'token'); route(); }
    else if (!cached.length) render([]);
  }
}

      const pend = all.filter(p => itemStatus(m, p) === 'pendente').length;
      box.innerHTML = `<div class="card ev-head"><div class="ev-cover" style="--c:${esc(m.cor)}" data-asset="capa"></div>
        <div class="ev-head-body"><div class="row wrap-row" style="gap:6px"><span class="pill ${m.aberto ? '' : 'off'}" style="background:var(--soft)"><span class="dot"></span>${m.aberto ? 'Recebendo fotos' : 'Envio encerrado'}</span><span class="pill" style="background:var(--soft)">${ic('palette', 13)} ${esc(TEMPLATES[m.template].nome)}</span>${m.moderacao ? `<span class="pill" style="background:var(--soft)">${ic('check', 13)} Aprovação ativada</span>` : ''}</div>
          <h2>${esc(m.nome)}</h2><div class="ev-meta">${m.anfitrioes ? `<span>${ic('heart', 15)}${esc(m.anfitrioes)}</span>` : ''}${m.data ? `<span>${ic('cal', 15)}${esc(fmtDate(m.data))}${m.hora ? ' · ' + esc(m.hora) : ''}</span>` : ''}${m.local ? `<span>${ic('pin', 15)}${esc(m.local)}</span>` : ''}</div>
          <div class="row wrap-row" style="margin-top:4px;gap:8px"><a class="btn sm" href="${base}/personalizar">${ic('palette', 16)} Personalizar</a><button class="btn sm ghost" id="eToggle">${ic(m.aberto ? 'lock' : 'upload', 16)} ${m.aberto ? 'Encerrar envios' : 'Reabrir envios'}</button><button class="btn sm ghost" id="eTv">${ic('play', 16)} Telão</button></div></div></div>
        ${pend ? `<a class="alert info" href="${base}/fotos" style="margin-bottom:16px;text-decoration:none">${ic('info')}<div><b>${plural(pend, 'item aguardando', 'itens aguardando')} aprovação.</b> Toque para revisar.</div></a>` : ''}
        <div class="stats"><div class="card stat"><b>${sync.list('foto').length}</b><span>Fotos dos convidados</span></div><div class="card stat"><b>${sync.list('previa').length}</b><span>${esc(m.albumPrevia)}</span></div><div class="card stat"><b>${sync.list('recado').length}</b><span>Recados</span></div><div class="card stat"><b>${guests}</b><span>Convidados</span></div></div>
        <div class="sec-head"><h2>Links e QR codes</h2></div>
        <div class="links">${linkCard('up', L.up, m)}${linkCard('e', L.e, m)}${linkCard('h', L.h, m, { hl: true })}</div>
        <div class="card danger-zone"><div><h3 style="font-size:18px">Excluir evento</h3><p class="muted small">Apaga o evento, as fotos e os recados do GitHub. Não pode ser desfeito.</p></div><button class="btn danger" id="eDel">${ic('trash', 16)} Excluir evento</button></div>`;
      paintAssets(box, sync.assets); bindLinkCards(box, m);
      $('#eToggle').onclick = async () => { try { await mutateMeta(sync, mm => { mm.aberto = !mm.aberto; }); toast(sync.meta.aberto ? 'Envios reabertos' : 'Envios encerrados', 'ok'); drawTab(); } catch (e) { toast(e.message, 'err'); } };
      $('#eTv').onclick = () => openSlideshow(sync, L.up);
      $('#eDel').onclick = deleteEvent;
      view = null;
    } else if (tab === 'fotos') view = moderationView(box, sync, 'admin', 'foto');
    else if (tab === 'previa') view = previaView(box, sync, 'admin');
    else if (tab === 'recados') view = moderationView(box, sync, 'admin', 'recado');
    else if (tab === 'personalizar') { personalizeView(box, sync, 'admin'); view = null; }
  }
  async function deleteEvent() {
    if (!await confirmDlg('Excluir este evento?', `"${sync.meta.nome}" e todos os ${sync.items.size} itens serão apagados do GitHub. Essa ação não pode ser desfeita.`, 'Excluir tudo', true)) return;
    try {
      await sync.refresh({ force: true }).catch(() => {});
      for (const g of sync.gists.filter(g => !g.main)) await sync.gh.remove(g.id);
      await sync.gh.remove(id);
      for (const p of sync.items.values()) await DB.del('items', p.key);
      await DB.del('events', id); await DB.del('assets', id + '|capa'); await DB.del('assets', id + '|fundo');
      state.syncs.forEach((v, k) => { if (k.startsWith(id + '|')) state.syncs.delete(k); });
      toast('Evento excluído', 'ok'); location.hash = '#/admin';
    } catch (e) { toast(e.message, 'err'); }
  }
  const redraw = throttle(() => { if (!drawn) return; drawTabs(); if (view) view.draw(); else if (tab === 'resumo') drawTab(); }, 400);
  sync.on('meta', () => { if (drawn && tab !== 'personalizar') { drawTabs(); if (tab === 'resumo') drawTab(); else view?.draw(); } });
  sync.on('assets', () => { if (drawn) paintAssets(app, sync.assets); });
  sync.on('items', redraw);
  if (sync.meta) draw(); else { applySysLook(); app.innerHTML = loadingScreen('Carregando evento…'); }
  try { await sync.refresh({ force: true }); if (!drawn) draw(); else redraw(); }
  catch (e) {
    if (!drawn) { adminShell('eventos', { title: 'Evento', back: '#/admin' }); $('#content').innerHTML = msgScreen('alert', 'Não foi possível abrir o evento', e.message, `<a class="btn" href="#/admin">${ic('back')} Voltar</a>`); }
    else toast(e.message, 'err');
    if (e.code === 'auth') { state.cfg.token = null; await DB.del('kv', 'token'); }
    return;
  }
  startPolling(() => sync.refresh(), 30000);
}

function AdminLook() {
  if (!state.cfg.token) return AdminSetup();
  const L = state.look; let img = L.img;
  applySysLook(); document.title = 'Aparência · ' + APP_NAME;
  adminShell('aparencia', { title: 'Aparência do sistema', sub: 'Tema, cor e plano de fundo do painel' });
  const box = $('#content');
  const draw = () => {
    box.innerHTML = `<div class="pz">
      <section class="card pz-sec"><h3>Tema</h3><p class="muted">Claro, escuro ou seguindo o aparelho.</p><div class="seg" id="lkMode">${[['light', 'Claro', 'sun'], ['dark', 'Escuro', 'moon'], ['auto', 'Automático', 'monitor']].map(([k, l, i]) => `<button data-m="${k}" class="${L.mode === k ? 'on' : ''}">${ic(i, 16)} ${l}</button>`).join('')}</div></section>
      <section class="card pz-sec"><h3>Cor de destaque</h3><p class="muted">Botões e detalhes do painel.</p>${swatchesHTML(L.cor, 'lkcor')}</section>
      <section class="card pz-sec"><h3>Plano de fundo</h3><p class="muted">Fica atrás de todas as telas do painel neste aparelho.</p>
        <div class="seg" id="lkBgT">${[['template', 'Padrão'], ['cor', 'Cor'], ['gradiente', 'Gradiente'], ['imagem', 'Imagem']].map(([k, l]) => `<button data-bt="${k}" class="${L.fundo.tipo === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div id="lkO">${L.fundo.tipo === 'cor' ? `<input type="color" id="lkC" value="${esc(/^#/.test(L.fundo.valor) ? L.fundo.valor : '#e9e4dc')}" style="width:64px;height:46px;padding:4px">` : ''}
          ${L.fundo.tipo === 'gradiente' ? `<div class="swatches">${Object.entries(GRADIENTS).map(([k, g]) => `<button class="sw big ${L.fundo.valor === k ? 'on' : ''}" data-g="${k}" style="background:${g.css};${k === 'noite' || k === 'grafite' ? 'color:#fff' : ''}">${g.nome}</button>`).join('')}</div>` : ''}
          ${L.fundo.tipo === 'imagem' ? `<label class="btn sm">${ic('upload', 16)} ${img ? 'Trocar imagem' : 'Escolher imagem'}<input class="sr" type="file" accept="image/*" id="lkIn"></label>` : ''}
          ${L.fundo.tipo !== 'template' ? `<div class="field" style="margin:16px 0 0"><label class="f">Suavizar o fundo</label><input type="range" min="0" max="0.95" step="0.05" value="${L.fundo.veu}" id="lkVeu"></div>` : ''}</div></section>
      <p class="muted small">As alterações são aplicadas na hora e ficam salvas neste aparelho. O visual do site de cada evento é configurado em <b>Personalizar</b>, dentro do evento.</p></div>`;
  };
  const save = () => { L.img = img; DB.put('kv', L, 'sysLook'); applySysLook(); };
  box.addEventListener('click', e => {
    const mo = e.target.closest('[data-m]'); if (mo) { L.mode = mo.dataset.m; save(); draw(); return; }
    const bt = e.target.closest('[data-bt]'); if (bt) { L.fundo.tipo = bt.dataset.bt; if (L.fundo.tipo === 'gradiente' && !GRADIENTS[L.fundo.valor]) L.fundo.valor = 'aurora'; if (L.fundo.tipo === 'cor' && !/^#/.test(L.fundo.valor)) L.fundo.valor = '#e9e4dc'; save(); draw(); return; }
    const g = e.target.closest('[data-g]'); if (g) { L.fundo.valor = g.dataset.g; save(); draw(); }
  });
  box.addEventListener('input', e => {
    if (e.target.id === 'lkC') { L.fundo.valor = e.target.value; save(); }
    if (e.target.id === 'lkVeu') { L.fundo.veu = +e.target.value; save(); }
  });
  box.addEventListener('change', async e => { if (e.target.id === 'lkIn') { const f = e.target.files[0]; if (!f) return; try { img = (await compressImage(f, 1920, 0.8, 1500000)).data; save(); draw(); } catch (err) { toast(err.message, 'err'); } } });
  draw();
  bindSwatchesLive();
  function bindSwatchesLive() { box.addEventListener('click', e => { const b = e.target.closest('[data-sw="lkcor"] [data-c]'); if (b) { L.cor = b.dataset.c; save(); draw(); } }); box.addEventListener('input', e => { if (e.target.closest('[data-sw="lkcor"]')) { L.cor = e.target.value; save(); } }); }
}

function AdminAccount() {
  if (!state.cfg.token) return AdminSetup();
  applySysLook(); document.title = 'Conta · ' + APP_NAME;
  adminShell('conta', { title: 'Conta e ajuda' });
  const box = $('#content');
  box.innerHTML = `<div class="pz">
    <section class="card pz-sec"><h3>Conta conectada</h3><p class="muted">Conta GitHub onde os eventos ficam guardados.</p>
      <div class="user-chip" style="margin-bottom:16px">${state.cfg.user?.avatar_url ? `<img src="${esc(state.cfg.user.avatar_url)}" alt="">` : '<span class="av"></span>'}<span>${esc(state.cfg.user?.login || '—')}<small>Token salvo neste aparelho</small></span></div>
      <div class="field"><label class="f" for="sBu">Endereço público do site</label><input id="sBu" value="${esc(state.cfg.baseUrl || '')}" placeholder="${esc(baseHere())}"><p class="hint">Usado nos links e QR codes. Em branco = endereço atual.</p></div>
      <div class="field"><label class="f" for="sTk">Trocar token <span class="opt">(opcional)</span></label><input id="sTk" type="password" placeholder="ghp_…" autocomplete="off"></div>
      <div class="row wrap-row"><button class="btn" id="sSave">${ic('check')} Salvar</button><button class="btn ghost" id="sClear">${ic('trash', 16)} Limpar cache local</button><button class="btn danger" id="sOut">${ic('logout', 16)} Desconectar</button></div></section>
    <section class="card pz-sec"><h3>Aplicativo</h3><p class="muted">${isStandalone() ? 'Você está usando o sistema como app instalado. ✅' : 'Instale para abrir como app no celular e como programa no computador.'}</p>${!isStandalone() ? `<button class="btn" data-inst>${ic('inst')} Instalar como app</button>` : ''}</section>
    <section class="card pz-sec help"><h3>Como funciona</h3>
      <h4>1. Crie o evento</h4><p>Escolha o tipo (casamento, 15 anos…). O sistema já sugere modelo, cores e textos.</p>
      <h4>2. Envie o painel aos anfitriões</h4><p>No resumo do evento, o card <b>Painel dos noivos/debutante</b> tem o link (com botão de WhatsApp). Por ele os anfitriões enviam as fotos da prévia, escolhem a capa, personalizam o site e moderam fotos — você define o que eles podem fazer.</p>
      <h4>3. Divulgue para os convidados</h4><p>Imprima a <b>placa com QR code de envio</b> para as mesas e compartilhe o <b>link do site</b>. Os convidados enviam fotos e recados pelo celular, sem instalar nada.</p>
      <h4>4. Durante a festa</h4><p>Abra o <b>Modo telão</b> numa TV ou projetor: as fotos e recados aparecem na hora, com o QR code no canto.</p>
      <h4>5. Depois</h4><p>Baixe tudo em ZIP (fotos separadas por álbum + arquivo com os recados). Feche os envios quando quiser.</p>
      <h4>Limites</h4><p>Cada foto de convidado é reduzida para até ~600 KB (prévias até ~900 KB). Cada Gist guarda até ${MAX_FILES_PER_GIST} itens; quando enche, o sistema cria outro automaticamente.</p></section></div>`;
  $$('[data-inst]', box).forEach(b => b.onclick = installApp);
  $('#sSave').onclick = async () => {
    const b = $('#sBu').value.trim(), t = $('#sTk').value.trim();
    try {
      if (t) { const u = await new GH(t).user(); state.cfg.token = t; state.cfg.user = { login: u.login, avatar_url: u.avatar_url }; await DB.put('kv', t, 'token'); await DB.put('kv', state.cfg.user, 'user'); state.syncs.clear(); }
      state.cfg.baseUrl = b ? b.split('#')[0] : ''; await DB.put('kv', state.cfg.baseUrl, 'baseUrl');
      toast('Configurações salvas', 'ok'); route();
    } catch (e) { toast(e.message, 'err'); }
  };
  $('#sClear').onclick = async () => {
    for (const s of ['items', 'events', 'assets']) for (const r of await DB.all(s)) await DB.del(s, r.key || r.id);
    urlCache.forEach(u => URL.revokeObjectURL(u)); urlCache.clear(); state.syncs.clear();
    toast('Cache local limpo', 'ok');
  };
  $('#sOut').onclick = async () => {
    if (!await confirmDlg('Desconectar?', 'O token será removido deste aparelho. Os eventos continuam salvos no GitHub.', 'Desconectar', true)) return;
    await DB.del('kv', 'token'); await DB.del('kv', 'user'); state.cfg.token = null; state.cfg.user = null; state.syncs.clear(); location.hash = '#/admin'; route();
  };
}

/* ---------------- Roteador ---------------- */
async function route() {
  state.cleanup.splice(0).forEach(f => { try { f(); } catch {} });
  $$('.newpill').forEach(b => b.remove());
  window.scrollTo(0, 0);
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (p.length) DB.put('kv', location.hash, 'lastRoute');
  try {
    if (['e', 'up', 'h'].includes(p[0]) && p[1] && p[2]) {
      let tok; try { tok = decTok(p[2]); } catch { tok = null; }
      if (!tok || !/^[\w-]{20,}$/.test(tok) || !/^[a-f0-9]{20,}$/i.test(p[1])) { applySysLook(); app.innerHTML = msgScreen('alert', 'Link inválido', 'Este link parece incompleto. Escaneie o QR code novamente.'); return; }
      if (p[0] === 'e') return await Gallery(p[1], tok);
      if (p[0] === 'up') return await Upload(p[1], tok, p[3]);
      return await Host(p[1], tok, p[3] || 'inicio');
    }
    if (p[0] === 'admin' && p[1] === 'evento' && p[2]) return await AdminEvent(p[2], p[3] || 'resumo');
    if (p[0] === 'admin' && p[1] === 'aparencia') return AdminLook();
    if (p[0] === 'admin' && p[1] === 'conta') return AdminAccount();
    return await AdminHome();
  } catch (e) {
    console.error(e); applySysLook();
    app.innerHTML = msgScreen('alert', 'Algo deu errado', e.message || String(e), `<button class="btn" onclick="location.reload()">${ic('refresh')} Recarregar</button>`);
  }
}

(async function init() {
  state.cfg.token = await DB.get('kv', 'token');
  state.cfg.user = await DB.get('kv', 'user');
  state.cfg.baseUrl = (await DB.get('kv', 'baseUrl')) || '';
  const lk = await DB.get('kv', 'sysLook'); state.look = { ...defaultLook(), ...(lk || {}) }; state.look.fundo = { ...defaultLook().fundo, ...(state.look.fundo || {}) };
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (document.body.classList.contains('syspage')) applySysLook(); });
  if ((!location.hash || location.hash === '#') && (isStandalone() || /[?&]app=1/.test(location.search))) {
    const last = await DB.get('kv', 'lastRoute'); if (last) history.replaceState(null, '', location.pathname + location.search + last);
  }
  window.addEventListener('hashchange', route);
  registerSW();
  route();
})();
</script>
