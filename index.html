<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FotoEvento</title>
<meta name="theme-color" content="#17161a">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{
  --accent:#e11d48; --accent-ink:#fff;
  --bg:#f7f5f2; --card:#fff; --ink:#17161a; --muted:#6b6873; --line:#e8e4de; --soft:#efebe5;
  --radius:22px; --shadow:0 1px 2px rgba(20,16,10,.05),0 10px 30px -12px rgba(20,16,10,.16);
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --row:132px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;font-size:15.5px;line-height:1.5}
body.noscroll{overflow:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-.025em;margin:0;line-height:1.05;font-weight:700}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)} .small{font-size:13.5px} .center{text-align:center}
.row{display:flex;align-items:center;gap:10px} .row.end{justify-content:flex-end} .row.wrap-row{flex-wrap:wrap} .spacer{flex:1}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.eyebrow.light{color:rgba(255,255,255,.8)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink);text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;white-space:nowrap;line-height:1.2}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.soft{background:color-mix(in srgb,var(--accent) 11%,#fff);color:color-mix(in srgb,var(--accent) 85%,#000)}
.btn.dark{background:var(--ink);color:#fff}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.btn.danger{background:#fde8e8;color:#b42318}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn.lg{padding:16px 26px;font-size:16.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;display:inline-grid;place-items:center;background:transparent;color:inherit;transition:background .15s}
.icon-btn:hover{background:rgba(0,0,0,.06)}
.icon-btn.light{background:rgba(255,255,255,.12);color:#fff}
.icon-btn.light:hover{background:rgba(255,255,255,.24)}

/* forms */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
input,textarea,select{font:inherit;width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
label.f{display:block;font-weight:600;font-size:14px;margin:0 0 7px}
.opt{font-weight:400;color:var(--muted)}
.field{margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.switch{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;margin-bottom:12px}
.switch input{display:none}
.switch .knob{flex:none;width:44px;height:26px;border-radius:99px;background:#d6d1ca;position:relative;transition:background .2s;margin-top:1px}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+.knob{background:var(--accent)}
.switch input:checked+.knob::after{transform:translateX(18px)}
.switch b{display:block;font-size:14.5px}
.switch span.d{font-size:13px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.sw-custom{width:34px;height:34px;padding:0;border-radius:50%;overflow:hidden;border:1.5px dashed var(--muted)}
.sw-custom input{opacity:0;width:100%;height:100%;cursor:pointer}
.cover-drop{position:relative;border:1.5px dashed var(--line);border-radius:18px;height:150px;display:grid;place-items:center;overflow:hidden;cursor:pointer;background:var(--soft) center/cover no-repeat;color:var(--muted);text-align:center;font-size:14px}
.cover-drop.has{border-style:solid;color:#fff}
.cover-drop.has span{background:rgba(0,0,0,.45);padding:6px 12px;border-radius:99px}
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:#fff7e6;color:#7a4b00;font-size:14px;border:1px solid #f6dfae}
.alert.info{background:color-mix(in srgb,var(--accent) 7%,#fff);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 22%,#fff)}
.alert svg{flex:none;margin-top:1px}

/* toast */
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:tin .3s ease;pointer-events:auto}
.toast.err{background:#b42318}.toast.ok{background:#067647}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(18,16,14,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{background:#fff;border-radius:26px;padding:26px;width:100%;max-width:460px;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.4);animation:up .25s cubic-bezier(.2,.9,.3,1.1)}
.modal.wide{max-width:640px}
.modal h3{font-size:24px;margin-bottom:8px}
.modal .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
@keyframes fade{from{opacity:0}} @keyframes up{from{opacity:0;transform:translateY(16px) scale(.98)}}
@media(max-width:560px){.modal-bg{place-items:end center;padding:0}.modal{border-radius:26px 26px 0 0;max-height:94dvh;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}.grid2{grid-template-columns:1fr}}

/* screens */
.screen{min-height:100dvh;display:grid;place-items:center;padding:30px 20px;text-align:center}
.screen .box{max-width:420px}
.screen .ico{width:72px;height:72px;border-radius:24px;background:color-mix(in srgb,var(--accent) 12%,#fff);color:var(--accent);display:grid;place-items:center;margin:0 auto 20px}
.screen h2{font-size:28px;margin-bottom:10px}
.screen p{color:var(--muted);margin-bottom:22px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid color-mix(in srgb,var(--accent) 20%,transparent);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== ADMIN ===== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(247,245,242,.85);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{height:66px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.03em}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center}
.user-chip{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:4px 12px 4px 4px;border-radius:99px;background:#fff;border:1px solid var(--line)}
.user-chip img{width:28px;height:28px;border-radius:50%}
.admin-main{padding-top:34px;padding-bottom:80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.page-head h1{font-size:clamp(32px,5vw,46px)}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.ev-card{display:block;text-decoration:none;overflow:hidden;transition:transform .2s,box-shadow .2s}
.ev-card:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(0,0,0,.05),0 22px 40px -18px rgba(20,16,10,.3)}
.ev-cover{height:150px;background:var(--c,#333) center/cover no-repeat;position:relative}
.ev-cover.grad{background-image:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--c) 70%,#fff) 0,transparent 55%),linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 40%,#000))}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:#fff;color:var(--ink)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#12b76a}
.pill.off .dot{background:#98a2b3}
.ev-cover .pill{position:absolute;top:12px;left:12px}
.ev-body{padding:18px 20px 20px}
.ev-body h3{font-size:21px;margin-bottom:6px}
.ev-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13.5px}
.ev-meta span{display:inline-flex;align-items:center;gap:5px}
.ev-count{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:14px}
.ev-count b{font-family:var(--display);font-size:20px}
.empty{padding:60px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--radius)}
.empty h3{font-size:22px;margin:14px 0 6px}
.skel{background:linear-gradient(90deg,#ece8e2 0,#f5f2ee 50%,#ece8e2 100%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:var(--radius);height:280px}
@keyframes sk{to{background-position:-200% 0}}

.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:18px}
.back:hover{color:var(--ink)}
.ev-head{display:grid;grid-template-columns:240px 1fr;overflow:hidden;margin-bottom:22px}
.ev-head .ev-cover{height:100%;min-height:180px}
.ev-head-body{padding:24px 26px;display:flex;flex-direction:column;gap:12px}
.ev-head-body h1{font-size:clamp(28px,4vw,40px)}
@media(max-width:700px){.ev-head{grid-template-columns:1fr}.ev-head .ev-cover{min-height:150px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{padding:18px 20px}
.stat b{display:block;font-family:var(--display);font-size:32px;line-height:1}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.links{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:34px}
@media(max-width:900px){.links{grid-template-columns:1fr}}
.link-card{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:20px}
.qr-box{width:150px;height:150px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);padding:6px}
.qr-box svg{width:100%;height:100%;display:block}
.link-body h3{font-size:19px;margin-bottom:4px}
.link-body p{font-size:13.5px;margin-bottom:12px}
.url-box input{font-size:12.5px;padding:9px 12px;border-radius:11px;background:var(--soft);border-color:transparent;margin-bottom:12px;color:var(--muted)}
@media(max-width:520px){.link-card{grid-template-columns:1fr}.qr-box{width:170px;height:170px;margin:0 auto}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{font-size:26px}
.tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px;flex-wrap:wrap}
.tab{border:0;background:transparent;border-radius:99px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--ink);color:#fff}
.tab small{opacity:.7;margin-left:3px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
@media(max-width:520px){.agrid{grid-template-columns:repeat(2,1fr);gap:10px}}
.atile{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative}
.atile-img{display:block;width:100%;aspect-ratio:1;border:0;padding:0;background:var(--soft)}
.atile-img img{width:100%;height:100%;object-fit:cover}
.atile.st-oculta .atile-img img{opacity:.35;filter:grayscale(1)}
.atile .badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#fff}
.atile.st-pendente .badge{background:#fef0c7;color:#93370d}
.atile.st-oculta .badge{background:#344054;color:#fff}
.atile-bar{padding:8px 8px 8px 12px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.atile-bar .who{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atile-bar .acts{display:flex;flex:none}
.atile-bar .icon-btn{width:32px;height:32px}
.atile-bar .icon-btn.ok{color:#067647}.atile-bar .icon-btn.del{color:#b42318}
.danger-zone{margin-top:46px;padding:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-color:#f7d4d1}
.setup{max-width:560px;margin:0 auto;padding:50px 20px 80px}
.setup h1{font-size:clamp(34px,6vw,48px);margin-bottom:12px}
.steps{counter-reset:s;list-style:none;padding:0;margin:22px 0}
.steps li{counter-increment:s;position:relative;padding-left:44px;margin-bottom:14px;font-size:14.5px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.steps a{color:var(--accent);font-weight:600}
code{background:var(--soft);padding:2px 6px;border-radius:6px;font-size:.9em}

/* ===== GALLERY ===== */
.hero{position:relative;color:#fff;min-height:min(78vh,640px);display:flex;align-items:flex-end;overflow:hidden;background:#111}
.hero-bg{position:absolute;inset:-2px;background:var(--accent) center/cover no-repeat;transform:scale(1.04);animation:kb 24s ease-in-out infinite alternate}
.hero-bg.grad{background-image:radial-gradient(circle at 15% 25%,color-mix(in srgb,var(--accent) 60%,#fff) 0,transparent 45%),radial-gradient(circle at 85% 70%,color-mix(in srgb,var(--accent) 80%,#000) 0,transparent 55%),linear-gradient(150deg,var(--accent),#120f14);animation:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0,rgba(0,0,0,.1) 35%,rgba(0,0,0,.72) 100%)}
@keyframes kb{to{transform:scale(1.12) translate(-1%,-1%)}}
.hero-in{position:relative;z-index:1;padding-top:90px;padding-bottom:46px;width:100%}
.hero-title{font-size:clamp(42px,9vw,104px);font-weight:800;letter-spacing:-.045em;line-height:.92;margin-bottom:18px;max-width:14ch;text-wrap:balance}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:15.5px;font-weight:500;opacity:.92;margin-bottom:14px}
.hero-meta span{display:inline-flex;align-items:center;gap:7px}
.hero-desc{max-width:560px;opacity:.85;font-size:16px;margin-bottom:26px}
.hero-actions{flex-wrap:wrap}
.gbar{position:sticky;top:0;z-index:40;background:rgba(247,245,242,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.gbar-in{height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.gbar-title{font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar-title small{font-family:var(--font);font-weight:500;color:var(--muted);font-size:13.5px;margin-left:6px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.live i{width:8px;height:8px;border-radius:50%;background:#12b76a;box-shadow:0 0 0 0 rgba(18,183,106,.6);animation:pulse 2s infinite}
.live.err i{background:#f79009;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(18,183,106,0)}100%{box-shadow:0 0 0 0 rgba(18,183,106,0)}}
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));grid-auto-rows:var(--row);grid-auto-flow:dense;gap:10px;padding:22px 0 90px}
@media(max-width:900px){:root{--row:110px}.mosaic{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}}
@media(max-width:560px){:root{--row:21vw}.mosaic{grid-template-columns:repeat(3,1fr);gap:4px;padding-top:4px}.mosaic-wrap{padding:0 4px}}
.tile{position:relative;overflow:hidden;border-radius:14px;background:#e6e1da;cursor:zoom-in;border:0;padding:0;grid-row:span 2}
.tile.w2{grid-column:span 2}
@media(max-width:560px){.tile{border-radius:6px}}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s;opacity:0}
.tile img.ld{opacity:1}
.tile:hover img{transform:scale(1.05)}
.tile .who{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .25s;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:hover .who{opacity:1}
.tile.new{animation:pop .7s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.gempty{text-align:center;padding:70px 20px 100px}
.gempty .ico{width:84px;height:84px;border-radius:28px;background:color-mix(in srgb,var(--accent) 12%,#fff);color:var(--accent);display:grid;place-items:center;margin:0 auto 18px}
.gempty h2{font-size:28px;margin-bottom:8px}
.gempty p{color:var(--muted);margin-bottom:22px}
.newpill{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:60;box-shadow:0 12px 30px -8px rgba(0,0,0,.35);animation:tin .3s}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:45;box-shadow:0 14px 30px -10px color-mix(in srgb,var(--accent) 80%,#000)}
@media(min-width:900px){.fab{display:none}}
.gfoot{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 40px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:300;background:rgba(10,9,8,.96);color:#fff;display:grid;grid-template-rows:auto 1fr auto;animation:fade .2s;touch-action:pan-y}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px calc(0px);padding-top:calc(12px + env(safe-area-inset-top))}
.lb-count{font-size:14px;opacity:.7;padding-left:6px}
.lb-stage{position:relative;display:grid;place-items:center;min-height:0;padding:0 8px}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;user-select:none;-webkit-user-drag:none;transition:opacity .2s}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;z-index:2}

<script>
'use strict';
/* =====================================================================
   FotoEvento — fotos de convidados com sincronização via GitHub Gist
   Rotas:
     #/admin                 → painel (lista de eventos)
     #/admin/evento/<id>     → gerenciar evento
     #/e/<id>/<chave>        → site/galeria pública do evento
     #/up/<id>/<chave>       → página de envio de fotos (QR code)
   ===================================================================== */

const TAG_MAIN = '[FotoEvento] ';
const TAG_PART = id => `[FotoEvento-parte:${id}]`;
const MAX_FILES_PER_GIST = 100;          // fotos por gist (o evento cria "partes" automaticamente)
const MAX_BATCH_BYTES = 3.2 * 1024 * 1024;
const MAX_PHOTO_CHARS = 850000;          // ~620 KB de JPEG por foto
const POLL_MS = 25000;
const COLORS = ['#e11d48','#db2777','#c2410c','#b7791f','#059669','#0891b2','#2563eb','#4f46e5','#7c3aed','#27272a'];
const app = document.getElementById('app');
const state = { cfg: {}, cleanup: [] };

/* ---------------- utilidades ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
class AppError extends Error { constructor(m, code) { super(m); this.code = code; } }

function encTok(t) { return btoa(t.split('').reverse().join('')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function decTok(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return atob(s).split('').reverse().join(''); }
const isPhoto = n => /^f_\d+_[a-z0-9]+\.json$/i.test(n);
const rand = () => Math.random().toString(36).slice(2, 8);
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase().slice(0, 40) || 'evento';

function fmtDate(d) {
  if (!d) return '';
  const [y, m, dd] = d.split('-').map(Number);
  if (!y) return d;
  return new Date(y, m - 1, dd).toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
}
function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return 'agora';
  if (s < 3600) return `há ${Math.floor(s / 60)} min`;
  if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  return new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function stamp(ts) { const d = new Date(ts), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }

function inkFor(hex) {
  const h = hex.replace('#', ''); if (h.length !== 6) return '#fff';
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4));
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.45 ? '#17161a' : '#ffffff';
}
function setAccent(c) {
  c = /^#[0-9a-f]{6}$/i.test(c || '') ? c : COLORS[0];
  document.documentElement.style.setProperty('--accent', c);
  document.documentElement.style.setProperty('--accent-ink', inkFor(c));
}
function toast(msg, type = '') {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), type === 'err' ? 5500 : 3200);
}
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const it = items[i++]; await fn(it); } }));
}
function dataURLtoBlob(d) {
  const [h, b] = d.split(','); const mime = (h.match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(b); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: mime });
}
function saveBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch { const i = document.createElement('textarea'); i.value = t; document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); }
  toast('Link copiado!', 'ok');
}
function loadScript(src, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = () => res(window[globalName]); s.onerror = () => rej(new AppError('Não foi possível carregar ' + globalName)); document.head.appendChild(s); });
}
async function fetchJSON(url) {
  let last;
  for (let i = 0; i < 3; i++) {
    try { const r = await fetch(url, { cache: 'force-cache' }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
    catch (e) { last = e; await sleep(800 * (i + 1)); }
  }
  throw last;
}
const baseHere = () => location.href.split('#')[0];

/* ---------------- ícones ---------------- */
const ICONS = {
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',

  play:'<path d="M6 3l14 9-14 9V3z"/>', pause:'<path d="M7 4h3v16H7zM14 4h3v16h-3z"/>',

  ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',

  eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff:'<path d="M9.9 9.9a3 3 0 1 0 4.2 4.2M10.7 5.1A10 10 0 0 1 12 5c7 0 10 7 10 7a13 13 0 0 1-1.7 2.7M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6M2 2l20 20"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', plus:'<path d="M12 5v14M5 12h14"/>',

  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',

  alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',

  sparkle:'<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/>',
  aperture:'<circle cx="12" cy="12" r="10"/><path d="m14.3 8 5.7 9.9M9.7 8h11.5M7.4 12l5.7-9.9M9.7 16 4 6.1M14.3 16H2.8M16.6 12l-5.7 9.9"/>',

const ic = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------------- IndexedDB ---------------- */
const DB = {
  _p: null, mem: { kv: new Map(), events: new Map(), photos: new Map(), queue: new Map() }, off: false,
  open() {
    if (this._p) return this._p;
    this._p = new Promise((res) => {
      let r;
      try { r = indexedDB.open('fotoevento', 1); } catch { this.off = true; return res(null); }
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('kv');
        d.createObjectStore('events', { keyPath: 'id' });
        d.createObjectStore('photos', { keyPath: 'key' }).createIndex('eventId', 'eventId');
        d.createObjectStore('queue', { keyPath: 'qid', autoIncrement: true }).createIndex('eventId', 'eventId');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => { console.warn('IndexedDB indisponível', r.error); this.off = true; res(null); };
    });
    return this._p;
  },
  async run(store, mode, fn) {
    const d = await this.open();
    if (!d) return fn(null);
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const r = fn(t.objectStore(store)); let out;
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  _key(store, v) { return store === 'events' ? v.id : store === 'photos' ? v.key : v.qid; },
  get(store, key) { return this.run(store, 'readonly', s => s ? s.get(key) : this.mem[store].get(key)).catch(() => undefined); },
  put(store, val, key) {
    return this.run(store, 'readwrite', s => {
      if (s) return key !== undefined ? s.put(val, key) : s.put(val);
      if (store === 'queue' && val.qid == null) val.qid = Date.now() + Math.random();
      this.mem[store].set(key !== undefined ? key : this._key(store, val), val); return null;
    }).catch(e => console.warn('IDB put', e));
  },
  del(store, key) { return this.run(store, 'readwrite', s => s ? s.delete(key) : (this.mem[store].delete(key), null)).catch(() => {}); },
  all(store) { return this.run(store, 'readonly', s => s ? s.getAll() : null).then(r => r || [...this.mem[store].values()]).catch(() => []); },
  byIndex(store, idx, val) { return this.run(store, 'readonly', s => s ? s.index(idx).getAll(val) : null).then(r => r || [...this.mem[store].values()].filter(x => x[idx] === val)).catch(() => []); },
};

/* ---------------- GitHub Gist API ---------------- */
class GH {
  constructor(token) { this.token = token; this.etag = null; this.multiPage = false; }
  async req(path, { method = 'GET', body, etag, light = false } = {}) {
    const headers = { Accept: 'application/vnd.github+json' };
    if (this.token) headers.Authorization = 'Bearer ' + this.token;
    if (etag) headers['If-None-Match'] = etag;
    const opts = { method, headers, cache: 'no-store' };
    if (body !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    for (let attempt = 0; attempt < 3; attempt++) {
      const ctrl = new AbortController(); opts.signal = ctrl.signal;
      let r;
      try { r = await fetch('https://api.github.com' + path, opts); }
      catch (e) {
        if (attempt < 2) { await sleep(1500 * (attempt + 1)); continue; }
        throw new AppError('Sem conexão com o servidor. Verifique sua internet e tente novamente.', 'net');
      }
      if (r.status === 304) return { notModified: true };
      if (r.ok) {
        // "light": a resposta do PATCH traz todas as fotos do gist; cancelamos o download do corpo.
        if (light || r.status === 204) { try { ctrl.abort(); } catch {} return { data: null }; }
        return { data: await r.json(), etag: r.headers.get('ETag') };
      }
      const ra = r.headers.get('Retry-After'), rem = r.headers.get('X-RateLimit-Remaining');
      if ((r.status === 403 || r.status === 429) && ra && attempt < 2) { await sleep(Math.min(+ra || 5, 60) * 1000); continue; }
      if (r.status >= 500 && attempt < 2) { await sleep(2000 * (attempt + 1)); continue; }
      let msg = ''; try { msg = (await r.json()).message || ''; } catch {}
      if (r.status === 401) throw new AppError('Chave de acesso inválida ou expirada.', 'auth');
      if ((r.status === 403 || r.status === 429) && rem === '0') throw new AppError('Limite de acessos do GitHub atingido. Aguarde alguns minutos.', 'rate');
      if (r.status === 403) throw new AppError('Acesso negado pelo GitHub. Verifique se o token tem permissão de Gists. ' + msg, 'forbidden');
      if (r.status === 404) throw new AppError('Não encontrado. O evento pode ter sido excluído.', '404');
      throw new AppError(`Erro do GitHub (${r.status}). ${msg}`, 'http');
    }
  }
  /** Lista os gists da conta (sem conteúdo, leve). Retorna null se nada mudou (ETag/304). */
  async listGists(useEtag = false) {
    const all = [];
    for (let page = 1; page <= 15; page++) {
      const res = await this.req(`/gists?per_page=100&page=${page}`, { etag: page === 1 && useEtag && !this.multiPage ? this.etag : null });
      if (res.notModified) return null;
      if (page === 1) this.etag = res.etag;

/* ---------------- Modelo do evento ---------------- */
function normalizeMeta(m = {}) {
  return {

    descricao: m.descricao || '', mensagem: m.mensagem || '', cor: m.cor || COLORS[0], capa: m.capa || '',

}
function photoStatus(meta, file) {
  if (!meta) return 'visivel';

  return 'visivel';
}
const urlCache = new Map();

/** Sincroniza um evento: lista leve via API (com ETag) + fotos via CDN do Gist + cache no IndexedDB */
class EventSync {
  constructor(id, token, { metaOnly = false } = {}) {
    this.id = id; this.gh = new GH(token); this.metaOnly = metaOnly;
    this.meta = null; this.metaRaw = null; this.photos = new Map(); this.gists = []; this.ls = {}; this.loaded = false;
  }
  on(ev, fn) { (this.ls[ev] = this.ls[ev] || []).push(fn); return () => { this.ls[ev] = this.ls[ev].filter(f => f !== fn); }; }
  emit(ev, ...a) { (this.ls[ev] || []).slice().forEach(f => { try { f(...a); } catch (e) { console.error(e); } }); }
  async loadCache() {
    const ev = await DB.get('events', this.id);
    if (ev && ev.meta) { this.meta = normalizeMeta(ev.meta); this.metaRaw = ev.metaRaw; }
    if (!this.metaOnly) (await DB.byIndex('photos', 'eventId', this.id)).forEach(p => this.photos.set(p.file, p));
  }
  async refresh({ force = false } = {}) {
    const list = await this.gh.listGists(!force);
    if (!list) return false;
    const mine = list.filter(g => g.id === this.id || (g.description || '').includes(TAG_PART(this.id)));
    const main = mine.find(g => g.id === this.id);
    if (!main) throw new AppError('Evento não encontrado. Ele pode ter sido excluído.', '404');
    this.gists = mine.map(g => ({ id: g.id, created: g.created_at, main: g.id === this.id, count: Object.keys(g.files).filter(isPhoto).length }));
    const raw = main.files['evento.json'] && main.files['evento.json'].raw_url;
    if (raw && raw !== this.metaRaw) {
      const m = normalizeMeta(await fetchJSON(raw));
      this.meta = m; this.metaRaw = raw;
      const old = (await DB.get('events', this.id)) || {};
      await DB.put('events', { ...old, id: this.id, meta: m, metaRaw: raw });
      this.emit('meta', m);
    }
    this.loaded = true;
    if (this.metaOnly) return true;

    const remote = new Map();
    for (const g of mine) for (const [n, f] of Object.entries(g.files)) if (isPhoto(n)) remote.set(n, { gistId: g.id, raw: f.raw_url });
    let removed = false;
    for (const k of [...this.photos.keys()]) if (!remote.has(k)) { this.photos.delete(k); DB.del('photos', this.id + '|' + k); removed = true; }
    for (const [n, info] of remote) { const p = this.photos.get(n); if (p && p.gistId !== info.gistId) p.gistId = info.gistId; }
    const missing = [...remote].filter(([n]) => !this.photos.has(n));
    if (removed && !missing.length) this.emit('photos', []);
    if (missing.length) {
      this.emit('loading', missing.length);
      const added = [];
      await pool(missing, 4, async ([n, info]) => {
        try {
          const j = await fetchJSON(info.raw);
          const rec = { key: this.id + '|' + n, eventId: this.id, file: n, gistId: info.gistId, autor: (j.autor || '').slice(0, 60), msg: (j.msg || '').slice(0, 300), ts: j.ts || +n.split('_')[1], w: j.w || 0, h: j.h || 0, blob: dataURLtoBlob(j.img) };
          await DB.put('photos', rec);
          this.photos.set(n, rec); added.push(rec); this.emit('photo', rec);
        } catch (e) { console.warn('Falha ao baixar foto', n, e); }
      });
      this.emit('photos', added);
    }
    return true;
  }
  list() { return [...this.photos.values()].sort((a, b) => b.ts - a.ts); }
  visible() { return this.list().filter(p => photoStatus(this.meta, p.file) === 'visivel'); }
  pickTarget(n) {
    const c = this.gists.filter(g => g.count + n <= MAX_FILES_PER_GIST).sort((a, b) => (b.created || '').localeCompare(a.created || ''));
    return c[0] || null;
  }
}

/* ---------------- Imagens ---------------- */
async function compressImage(file, max = 1600, quality = 0.82, limit = MAX_PHOTO_CHARS) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new AppError('Formato de imagem não suportado')); i.src = url; });
    let scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    for (let round = 0; round < 4; round++) {
      const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, w, h);
      let q = quality, data = c.toDataURL('image/jpeg', q);
      while (data.length > limit && q > 0.5) { q -= 0.08; data = c.toDataURL('image/jpeg', q); }
      if (data.length <= limit) return { data, w, h };
      scale *= 0.78;
    }
    throw new AppError('Imagem muito grande');
  } finally { URL.revokeObjectURL(url); }
}

/* ---------------- QR code ---------------- */
function qrMatrix(text) {
  if (typeof qrcode !== 'function') throw new AppError('Biblioteca de QR code não carregou');
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return { n: q.getModuleCount(), dark: (r, c) => q.isDark(r, c) };
}
function qrSVG(text, fg = '#17161a') {
  try {
    const { n, dark } = qrMatrix(text), m = 2; let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (dark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    const s = n + m * 2;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="${fg}"/></svg>`;
  } catch { return `<div class="muted small center" style="padding:20px">QR indisponível</div>`; }
}
function qrPNG(text, size = 1200) {
  const { n, dark } = qrMatrix(text), m = 3, cell = Math.floor(size / (n + m * 2)), s = cell * (n + m * 2);
  const c = document.createElement('canvas'); c.width = c.height = s;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, s, s); ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (dark(r, k)) ctx.fillRect((k + m) * cell, (r + m) * cell, cell, cell);
  return new Promise(res => c.toBlob(res, 'image/png'));
}

  const items = (await DB.byIndex('queue', 'eventId', sync.id)).sort((a, b) => a.created - b.created);
  if (!items.length) return 0;
  await sync.refresh({ force: true });
  const batches = []; let cur = [], size = 0;
  for (const it of items) {
    if (cur.length && (size + it.content.length > MAX_BATCH_BYTES || cur.length >= 10)) { batches.push(cur); cur = []; size = 0; }
    cur.push(it); size += it.content.length;
  }
  if (cur.length) batches.push(cur);
  let done = 0;
  onProgress && onProgress(0, items.length);
  for (const b of batches) {
    const files = Object.fromEntries(b.map(it => [it.name, { content: it.content }]));
    const target = sync.pickTarget(b.length);
    if (target) { await sync.gh.update(target.id, { files }); target.count += b.length; }
    else {
      const g = await sync.gh.create(`${TAG_PART(sync.id)} ${sync.meta ? sync.meta.nome : ''}`.trim(), files);
      sync.gists.push({ id: g.id, created: g.created_at || new Date().toISOString(), main: false, count: b.length });
    }
    for (const it of b) await DB.del('queue', it.qid);
    done += b.length; onProgress && onProgress(done, items.length);
  }
  return done;
}

async function Upload(id, tok) {
  const enc = encTok(tok);
  const sync = new EventSync(id, tok, { metaOnly: true });
  await sync.loadCache();
  const items = []; let sending = false, drawn = false;
  const guestName = (await DB.get('kv', 'guestName')) || '';

  async function pendingCount() { return (await DB.byIndex('queue', 'eventId', id)).length; }

  function draw() {
    const m = sync.meta; if (!m) return;
    setAccent(m.cor); document.title = 'Enviar fotos · ' + m.nome;
    drawn = true;
    if (!m.aberto) {
      app.innerHTML = msgScreen('lock', 'Envio encerrado', `O envio de fotos para "${m.nome}" foi encerrado. Você ainda pode ver o álbum.`, `<a class="btn" href="#/e/${id}/${enc}">${ic('image')} Ver álbum</a>`);
      return;
    }
    app.innerHTML = `
      <div class="up">
        <header class="up-hero"><div class="hero-bg ${m.capa ? '' : 'grad'}" id="upBg"></div>
          <div class="up-hero-in"><p class="eyebrow light">Envie suas fotos</p><h1>${esc(m.nome)}</h1>${dateLine(m) ? `<p class="sub">${esc(dateLine(m))}</p>` : ''}</div></header>
        <main class="up-main">
          <div class="card up-card" id="upCard"></div>
          <p class="up-foot"><a href="#/e/${id}/${enc}">${ic('image', 16)} Ver o álbum do evento →</a></p>
        </main>
        <div class="sendbar" id="sendbar" hidden><button class="btn lg block" id="sendBtn"></button></div>
      </div>`;
    if (m.capa) $('#upBg').style.backgroundImage = `url("${m.capa}")`;
    $('#sendBtn').onclick = send;
    drawForm();
  }

  function drawForm() {
    const m = sync.meta;
    $('#upCard').innerHTML = `
      ${m.mensagem ? `<p class="up-msg">${esc(m.mensagem)}</p>` : ''}
      <div id="pending"></div>
      <div class="field"><label class="f" for="gName">Seu nome <span class="opt">(opcional)</span></label><input id="gName" maxlength="60" autocomplete="name" placeholder="Como você quer aparecer no álbum" value="${esc(guestName)}"></div>
      <div class="field"><label class="f" for="gMsg">Recado <span class="opt">(opcional)</span></label><textarea id="gMsg" rows="2" maxlength="280" placeholder="Deixe uma mensagem junto com as fotos"></textarea></div>
      <div class="pick-row" id="pickRow">
        <label class="pick">${ic('camera', 30)}<span>Tirar foto</span><input class="sr" type="file" accept="image/*" capture="environment" id="inCam"></label>
        <label class="pick">${ic('image', 30)}<span>Escolher da galeria</span><input class="sr" type="file" accept="image/*" multiple id="inGal"></label>
      </div>
      <div class="previews" id="previews"></div>`;
    $('#inCam').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
    $('#inGal').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
    $('#gName').oninput = e => DB.put('kv', e.target.value.trim(), 'guestName');
    const pr = $('#pickRow');
    pr.addEventListener('dragover', e => { e.preventDefault(); $$('.pick', pr).forEach(p => p.classList.add('dragover')); });
    pr.addEventListener('dragleave', () => $$('.pick', pr).forEach(p => p.classList.remove('dragover')));
    pr.addEventListener('drop', e => { e.preventDefault(); $$('.pick', pr).forEach(p => p.classList.remove('dragover')); addFiles(e.dataTransfer.files); });
    $('#previews').addEventListener('click', e => {
      const b = e.target.closest('[data-rm]'); if (!b || sending) return;
      const k = items.findIndex(x => x.id === b.dataset.rm); if (k >= 0) items.splice(k, 1); drawPreviews();
    });
    drawPreviews(); drawPending();
  }

  async function drawPending() {
    const n = await pendingCount(), box = $('#pending'); if (!box) return;
    box.innerHTML = n ? `<div class="alert" style="margin-bottom:18px">${ic('alert')}<div><b>${n} foto${n > 1 ? 's' : ''} aguardando envio.</b> A conexão caiu da última vez. <a href="#" id="retryQ" style="font-weight:700">Enviar agora</a></div></div>` : '';
    const r = $('#retryQ'); if (r) r.onclick = e => { e.preventDefault(); send(); };
  }

  function drawPreviews() {
    const box = $('#previews'); if (!box) return;
    box.innerHTML = items.map(it => `<div class="pv ${it.status === 'error' ? 'err' : ''}">${it.data ? `<img src="${it.data}" alt="">` : ''}${it.status === 'processing' ? '<div class="st"><div class="spinner"></div></div>' : ''}<button class="rm" data-rm="${it.id}" aria-label="Remover">${ic('x', 15)}</button></div>`).join('');
    const ready = items.filter(i => i.status === 'ready').length, proc = items.some(i => i.status === 'processing');
    const bar = $('#sendbar'), btn = $('#sendBtn');
    bar.hidden = !items.length;
    btn.disabled = proc || !ready || sending;
    btn.innerHTML = proc ? `Preparando fotos…` : `${ic('upload')} Enviar ${ready} foto${ready === 1 ? '' : 's'}`;
  }

  async function addFiles(fileList) {
    const files = [...fileList].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name));
    if (!files.length) return;
    if (items.length + files.length > 60) { toast('Envie no máximo 60 fotos por vez.', 'err'); files.length = Math.max(0, 60 - items.length); }
    const added = files.map(f => ({ id: rand() + rand(), file: f, status: 'processing' }));
    items.push(...added); drawPreviews();
    await pool(added, 2, async it => {
      try { const r = await compressImage(it.file); Object.assign(it, r, { status: 'ready' }); }
      catch (e) { it.status = 'error'; toast(`Não foi possível ler "${it.file.name}". ${e.message}`, 'err'); }
      it.file = null; drawPreviews();
    });
  }

  async function send() {
    if (sending) return;
    const autor = ($('#gName')?.value || '').trim().slice(0, 60), msg = ($('#gMsg')?.value || '').trim().slice(0, 280);
    const ready = items.filter(i => i.status === 'ready');
    const now = Date.now();
    for (let k = 0; k < ready.length; k++) {
      const it = ready[k], ts = now + k;
      const content = JSON.stringify({ v: 1, autor, msg, ts, w: it.w, h: it.h, img: it.data });
      await DB.put('queue', { eventId: id, name: `f_${ts}_${rand()}.json`, content, created: ts });
    }
    const total = await pendingCount();
    if (!total) return;
    sending = true;
    const pm = modal(`<div class="center"><h3 id="pTitle">Enviando fotos…</h3><p class="muted" id="pText">Mantenha esta página aberta.</p><div class="progress"><i id="pBar"></i></div></div>`);
    try {
      const n = await processQueue(sync, (d, t) => { $('#pBar').style.width = Math.max(6, d / t * 100) + '%'; $('#pTitle').textContent = `Enviando ${Math.min(d + 1, t)} de ${t}…`; });
      items.length = 0; pm.close(true);
      const sent = ((await DB.get('kv', 'sent_' + id)) || 0) + n; await DB.put('kv', sent, 'sent_' + id);
      $('#sendbar').hidden = true;
      $('#upCard').innerHTML = `<div class="done"><div class="ico">${ic('check', 38)}</div><h2>Fotos enviadas!</h2><p>${n} foto${n > 1 ? 's' : ''} já ${n > 1 ? 'estão' : 'está'} no álbum. Obrigado por compartilhar! 💛<br><small>Você já enviou ${sent} foto${sent > 1 ? 's' : ''} para este evento.</small></p>
        <div class="row"><button class="btn" id="more">${ic('camera')} Enviar mais</button><a class="btn ghost" href="#/e/${id}/${enc}">${ic('image')} Ver álbum</a></div></div>`;
      $('#more').onclick = () => drawForm();
    } catch (e) {
      pm.close(true);
      toast(e.code === 'net' ? 'Sem conexão. Suas fotos ficaram salvas no aparelho e serão enviadas quando a internet voltar.' : e.message, 'err');
      items.splice(0, items.length, ...items.filter(i => i.status !== 'ready'));
      drawPreviews(); drawPending();
    } finally { sending = false; if ($('#sendBtn')) drawPreviews(); }
  }

  sync.on('meta', () => { if (!drawn || (!items.length && !sending)) draw(); });
  if (sync.meta) draw(); else app.innerHTML = loadingScreen('Abrindo evento…');
  try { await sync.refresh({ force: true }); if (!drawn) draw(); }
  catch (e) { if (!drawn) { app.innerHTML = msgScreen('alert', e.code === '404' ? 'Evento não encontrado' : 'Não foi possível abrir', e.message, `<button class="btn" onclick="location.reload()">${ic('refresh')} Tentar novamente</button>`); return; } }
  const onOnline = async () => { if (!sending && (await pendingCount())) send(); };
  window.addEventListener('online', onOnline); state.cleanup.push(() => window.removeEventListener('online', onOnline));
}

  };
  const cached = (await DB.all('events')).filter(e => e.meta && e.owner === state.cfg.user?.login);

  try {
    const gh = new GH(state.cfg.token);

    const mains = list.filter(g => (g.description || '').startsWith(TAG_MAIN) && g.files['evento.json']);
    const out = [];
    await pool(mains, 4, async g => {
      const parts = list.filter(p => (p.description || '').includes(TAG_PART(g.id)));
      const count = [g, ...parts].reduce((n, x) => n + Object.keys(x.files).filter(isPhoto).length, 0);
      const raw = g.files['evento.json'].raw_url, old = await DB.get('events', g.id);

      if (!meta) { try { meta = normalizeMeta(await fetchJSON(raw)); } catch { meta = normalizeMeta({ nome: g.description.slice(TAG_MAIN.length) }); } }
      const ev = { ...(old || {}), id: g.id, meta, metaRaw: raw, count, owner: state.cfg.user?.login };

    });

    render(out);
  } catch (e) {
    toast(e.message, 'err');
    if (e.code === 'auth') { state.cfg.token = null; await DB.del('kv', 'token'); route(); }
    else if (!cached.length) render([]);
  }

    cov.querySelector('span').textContent = 'Processando…';
    try { capa = (await compressImage(f, 1800, 0.8, 700000)).data; cov.style.backgroundImage = `url("${capa}")`; cov.classList.add('has'); cov.querySelector('span').textContent = 'Trocar imagem'; }
    catch (err) { toast(err.message, 'err'); cov.querySelector('span').textContent = 'Toque para escolher uma foto de capa'; }
  };
  const rm = $('#fCoverRm', el); if (rm) rm.onclick = () => { capa = ''; cov.style.backgroundImage = ''; cov.classList.remove('has'); cov.querySelector('span').textContent = 'Toque para escolher uma foto de capa'; rm.remove(); };
  $('#fSw', el).addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; cor = b.dataset.c; $$('.sw', el).forEach(s => s.classList.toggle('on', s === b)); });
  $('#fCustom', el).oninput = e => { cor = e.target.value; $$('.sw', el).forEach(s => s.classList.remove('on')); };
  $('#fSave', el).onclick = async () => {
    const nome = $('#fNome', el).value.trim();
    if (!nome) { $('#fNome', el).focus(); return toast('Informe o nome do evento.', 'err'); }
    const meta = normalizeMeta({ ...m, nome, data: $('#fData', el).value, hora: $('#fHora', el).value, local: $('#fLocal', el).value.trim(), descricao: $('#fDesc', el).value.trim(), mensagem: $('#fMsg', el).value.trim(), capa, cor, aberto: $('#fAberto', el).checked, moderacao: $('#fMod', el).checked });
    const btn = $('#fSave', el); btn.disabled = true; btn.textContent = 'Salvando…';
    try {
      const gh = new GH(state.cfg.token);
      const files = { 'evento.json': { content: JSON.stringify(meta) } };
      if (ev) {
        await gh.update(ev.id, { description: TAG_MAIN + nome, files });
        const old = (await DB.get('events', ev.id)) || {};
        await DB.put('events', { ...old, id: ev.id, meta, owner: state.cfg.user?.login });
        md.close(true); toast('Evento atualizado', 'ok'); onSaved && onSaved(meta);
      } else {
        const g = await gh.create(TAG_MAIN + nome, files);
        await DB.put('events', { id: g.id, meta, metaRaw: g.files['evento.json']?.raw_url, count: 0, owner: state.cfg.user?.login });
        md.close(true); toast('Evento criado! 🎉', 'ok'); location.hash = `#/admin/evento/${g.id}`;
      }
    } catch (e) { toast(e.message, 'err'); btn.disabled = false; btn.textContent = ev ? 'Salvar alterações' : 'Criar evento'; }
  };
  setTimeout(() => $('#fNome', el)?.focus(), 50);
}

function printCard(meta, url, kind) {
  const w = window.open('', '_blank');
  if (!w) return toast('Permita pop-ups para imprimir.', 'err');
  const up = kind === 'up', c = meta.cor;
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(meta.nome)} – QR code</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>@page{size:A5;margin:0}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:#17161a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .p{width:148mm;height:210mm;margin:0 auto;padding:16mm 14mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;border-top:7mm solid ${c}}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-size:30pt;line-height:1;letter-spacing:-.03em;margin:0 0 3mm}.e{font-size:9pt;letter-spacing:.2em;text-transform:uppercase;color:${c};font-weight:600;margin:0 0 4mm}
  .qr{width:92mm;height:92mm;padding:4mm;border:1.5mm solid ${c};border-radius:8mm}.qr svg{width:100%;height:100%}
  h2{font-family:'Bricolage Grotesque',sans-serif;font-size:20pt;margin:0 0 2mm}p{margin:0;font-size:11pt;color:#555}.s{font-size:10pt;color:#666;margin-top:2mm}</style></head>
  <body><div class="p"><div><p class="e">${esc(meta.nome)}</p><h1>${up ? 'Compartilhe suas fotos!' : 'Veja as fotos do evento'}</h1>${dateLine(meta) ? `<p class="s">${esc(dateLine(meta))}</p>` : ''}</div>
  <div class="qr">${qrSVG(url)}</div>
  <div><h2>${up ? 'Aponte a câmera do celular' : 'Escaneie o QR code'}</h2><p>${up ? 'Abra o link e envie as fotos que você tirou. Elas aparecem no álbum na hora!' : 'Acesse o álbum completo com as fotos de todos os convidados.'}</p></div></div>
  <script>window.onload=()=>setTimeout(()=>print(),600)<\/script></body></html>`);
  w.document.close();
}

function linkCard(title, desc, url, kind) {
  return `<div class="card link-card"><div class="qr-box">${qrSVG(url)}</div><div class="link-body">
    <h3>${title}</h3><p class="muted">${desc}</p><div class="url-box"><input readonly value="${esc(url)}" onclick="this.select()"></div>
    <div class="row wrap-row" style="gap:8px"><button class="btn sm" data-copy="${kind}">${ic('copy', 16)} Copiar</button><a class="btn sm ghost" href="${esc(url)}" target="_blank" rel="noopener">${ic('ext', 16)} Abrir</a><button class="btn sm ghost" data-qr="${kind}">${ic('download', 16)} QR</button><button class="btn sm ghost" data-print="${kind}">${ic('printer', 16)} Imprimir</button></div>
  </div></div>`;
}

async function AdminEvent(id) {
  if (!state.cfg.token) return AdminSetup();
  const sync = new EventSync(id, state.cfg.token);
  await sync.loadCache();
  let filter = 'todas', drawn = false;
  const urls = { up: linkUpload(id), e: linkGallery(id) };

  function draw() {
    const m = sync.meta; if (!m) return;
    setAccent(m.cor); document.title = m.nome + ' · Painel'; drawn = true;
    app.innerHTML = `${adminHeader()}<main class="wrap admin-main">
      <a href="#/admin" class="back">${ic('back', 17)} Todos os eventos</a>
      <div class="card ev-head"><div class="ev-cover ${m.capa ? '' : 'grad'}" style="--c:${esc(m.cor)}" id="hCover"></div>
        <div class="ev-head-body"><div><span class="pill ${m.aberto ? '' : 'off'}" style="background:var(--soft)"><span class="dot"></span>${m.aberto ? 'Recebendo fotos' : 'Envio encerrado'}</span></div>
          <h1>${esc(m.nome)}</h1>
          <div class="ev-meta">${m.data ? `<span>${ic('cal', 15)}${esc(fmtDate(m.data))}${m.hora ? ' · ' + esc(m.hora) : ''}</span>` : ''}${m.local ? `<span>${ic('pin', 15)}${esc(m.local)}</span>` : ''}${m.moderacao ? `<span>${ic('check', 15)}Aprovação ativada</span>` : ''}</div>
          <div class="row wrap-row" style="margin-top:4px"><button class="btn sm" id="eEdit">${ic('edit', 16)} Editar</button><button class="btn sm ghost" id="eToggle">${ic(m.aberto ? 'lock' : 'upload', 16)} ${m.aberto ? 'Encerrar envios' : 'Reabrir envios'}</button><a class="btn sm ghost" href="${esc(urls.e)}" target="_blank" rel="noopener">${ic('ext', 16)} Ver site</a><button class="btn sm ghost" id="eTv">${ic('play', 16)} Telão</button></div>
        </div></div>
      <div class="stats" id="stats"></div>
      <div class="links">
        ${linkCard('Link para enviar fotos', 'Coloque este QR code nas mesas, convites ou no telão. Os convidados abrem e enviam as fotos.', urls.up, 'up')}
        ${linkCard('Site do evento', 'O álbum com todas as fotos. Compartilhe com os convidados durante e depois do evento.', urls.e, 'e')}
      </div>
      <div class="sec-head"><h2>Fotos</h2><div class="row wrap-row"><div class="tabs" id="tabs"></div><button class="btn sm ghost" id="eSync" title="Atualizar">${ic('refresh', 16)}</button><button class="btn sm dark" id="eZip">${ic('download', 16)} Baixar todas</button></div></div>
      <div id="aGrid"></div>
      <div class="card danger-zone"><div><h3 style="font-size:19px">Excluir evento</h3><p class="muted small">Apaga o evento e todas as fotos do GitHub. Não pode ser desfeito.</p></div><button class="btn danger" id="eDel">${ic('trash', 16)} Excluir evento</button></div>
    </main>`;
    bindAdminHeader();
    if (m.capa) $('#hCover').style.backgroundImage = `url("${m.capa}")`;
    $('#eEdit').onclick = () => eventForm({ id, meta: m }, meta => { sync.meta = meta; draw(); });
    $('#eToggle').onclick = async () => { sync.meta.aberto = !sync.meta.aberto; await saveMeta(sync.meta.aberto ? 'Envios reabertos' : 'Envios encerrados'); draw(); };
    $('#eTv').onclick = () => openSlideshow(sync, urls.up);
    $('#eSync').onclick = async () => { try { await sync.refresh({ force: true }); drawPhotos(); toast('Atualizado', 'ok'); } catch (e) { toast(e.message, 'err'); } };
    $('#eZip').onclick = downloadZip;
    $('#eDel').onclick = deleteEvent;
    $$('[data-copy]').forEach(b => b.onclick = () => copyText(urls[b.dataset.copy]));
    $$('[data-qr]').forEach(b => b.onclick = async () => { try { saveBlob(await qrPNG(urls[b.dataset.qr]), `qrcode-${b.dataset.qr === 'up' ? 'envio' : 'site'}-${slug(m.nome)}.png`); } catch (e) { toast(e.message, 'err'); } });
    $$('[data-print]').forEach(b => b.onclick = () => printCard(m, urls[b.dataset.print], b.dataset.print));
    $('#tabs').addEventListener('click', e => { const t = e.target.closest('[data-f]'); if (t) { filter = t.dataset.f; drawPhotos(); } });
    $('#aGrid').addEventListener('click', onGridClick);
    drawPhotos();
  }

  function drawPhotos() {
    const all = sync.list(), m = sync.meta;
    const by = { todas: all, visivel: [], pendente: [], oculta: [] };
    all.forEach(p => by[photoStatus(m, p.file)].push(p));
    const authors = new Set(all.map(p => (p.autor || '').toLowerCase()).filter(Boolean));
    $('#stats').innerHTML = [['Fotos no total', all.length], ['Publicadas', by.visivel.length], [m.moderacao ? 'Aguardando aprovação' : 'Ocultas', m.moderacao ? by.pendente.length : by.oculta.length], ['Convidados', authors.size]]
      .map(([l, v]) => `<div class="card stat"><b>${v}</b><span>${l}</span></div>`).join('');
    const tabs = [['todas', 'Todas'], ['visivel', 'Publicadas'], ...(m.moderacao || by.pendente.length ? [['pendente', 'Pendentes']] : []), ['oculta', 'Ocultas']];
    $('#tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab ${filter === k ? 'on' : ''}" data-f="${k}">${l}<small>${by[k].length}</small></button>`).join('');
    const list = by[filter] || all;
    const label = { visivel: 'Publicada', pendente: 'Pendente', oculta: 'Oculta' };
    $('#aGrid').innerHTML = list.length ? `<div class="agrid">${list.map(p => {
      const st = photoStatus(m, p.file);
      return `<div class="atile st-${st}"><button class="atile-img" data-open="${esc(p.file)}"><img src="${photoURL(p)}" alt="" loading="lazy"></button>${st !== 'visivel' ? `<span class="badge">${label[st]}</span>` : ''}
        <div class="atile-bar"><span class="who" title="${esc(p.msg)}">${esc(p.autor || 'Anônimo')}</span><div class="acts">
          ${st === 'pendente' ? `<button class="icon-btn ok" data-act="approve" data-file="${esc(p.file)}" title="Aprovar">${ic('check', 17)}</button>` : ''}
          ${st === 'oculta' ? `<button class="icon-btn" data-act="show" data-file="${esc(p.file)}" title="Mostrar">${ic('eye', 17)}</button>` : `<button class="icon-btn" data-act="hide" data-file="${esc(p.file)}" title="Ocultar">${ic('eyeOff', 17)}</button>`}
          <button class="icon-btn del" data-act="del" data-file="${esc(p.file)}" title="Excluir">${ic('trash', 17)}</button></div></div></div>`;
    }).join('')}</div>` : `<div class="empty"><p class="muted">${all.length ? 'Nenhuma foto neste filtro.' : (sync.loaded ? 'Nenhuma foto recebida ainda. Compartilhe o QR code de envio!' : 'Carregando fotos…')}</p></div>`;
  }
  const redraw = throttleRAF(() => drawn && drawPhotos(), 300);

  async function saveMeta(okMsg) {
    try {
      await sync.gh.update(id, { description: TAG_MAIN + sync.meta.nome, files: { 'evento.json': { content: JSON.stringify(sync.meta) } } });
      const old = (await DB.get('events', id)) || {}; await DB.put('events', { ...old, id, meta: sync.meta });
      if (okMsg) toast(okMsg, 'ok');
    } catch (e) { toast(e.message, 'err'); }
  }

  async function onGridClick(e) {
    const o = e.target.closest('[data-open]');
    if (o) { const l = sync.list(); return openLightbox(l, l.findIndex(p => p.file === o.dataset.open)); }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const f = b.dataset.file, m = sync.meta, act = b.dataset.act;
    const rmFrom = (arr, v) => { const k = arr.indexOf(v); if (k >= 0) arr.splice(k, 1); };
    if (act === 'del') {
      if (!await confirmDlg('Excluir foto?', 'A foto será apagada definitivamente do álbum.', 'Excluir', true)) return;
      const p = sync.photos.get(f);
      try {
        await sync.gh.update(p.gistId, { files: { [f]: null } });
        sync.photos.delete(f); await DB.del('photos', p.key);
        rmFrom(m.ocultas, f); rmFrom(m.aprovadas, f); drawPhotos(); toast('Foto excluída', 'ok');
      } catch (err) { toast(err.message, 'err'); }
      return;
    }
    if (act === 'approve') { rmFrom(m.ocultas, f); if (!m.aprovadas.includes(f)) m.aprovadas.push(f); }
    if (act === 'hide') { if (!m.ocultas.includes(f)) m.ocultas.push(f); }
    if (act === 'show') { rmFrom(m.ocultas, f); if (m.moderacao && !m.aprovadas.includes(f)) m.aprovadas.push(f); }
    drawPhotos(); saveMeta();
  }

  async function downloadZip() {
    const list = sync.list(); if (!list.length) return toast('Ainda não há fotos.', 'err');
    const btn = $('#eZip'); btn.disabled = true; btn.textContent = 'Preparando…';
    try {
      const JSZip = await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js', 'JSZip');
      const zip = new JSZip(), used = new Set();
      list.forEach(p => { let n = `${stamp(p.ts)}${p.autor ? '_' + slug(p.autor) : ''}`, b = n, k = 2; while (used.has(n)) n = b + '_' + k++; used.add(n); zip.file(n + '.jpg', p.blob); });
      const blob = await zip.generateAsync({ type: 'blob' }, md => { btn.textContent = `Compactando ${Math.round(md.percent)}%`; });
      saveBlob(blob, `fotos-${slug(sync.meta.nome)}.zip`);
    } catch (e) { toast(e.message, 'err'); }
    btn.disabled = false; btn.innerHTML = `${ic('download', 16)} Baixar todas`;
  }

  async function deleteEvent() {
    if (!await confirmDlg('Excluir este evento?', `"${sync.meta.nome}" e todas as ${sync.photos.size} fotos serão apagados do GitHub. Essa ação não pode ser desfeita.`, 'Excluir tudo', true)) return;
    try {
      await sync.refresh({ force: true }).catch(() => {});
      for (const g of sync.gists.filter(g => !g.main)) await sync.gh.remove(g.id);
      await sync.gh.remove(id);
      for (const p of sync.photos.values()) await DB.del('photos', p.key);
      await DB.del('events', id); toast('Evento excluído', 'ok'); location.hash = '#/admin';
    } catch (e) { toast(e.message, 'err'); }
  }

  sync.on('meta', () => { if (drawn) draw(); });
  sync.on('photo', redraw); sync.on('photos', redraw);
  if (sync.meta) draw(); else app.innerHTML = adminHeader() + loadingScreen('Carregando evento…');
  try { await sync.refresh({ force: true }); if (!drawn) draw(); else drawPhotos(); }
  catch (e) {
    if (!drawn) { app.innerHTML = adminHeader() + msgScreen('alert', 'Não foi possível abrir o evento', e.message, `<a class="btn" href="#/admin">${ic('back')} Voltar</a>`); bindAdminHeader(); }
    else toast(e.message, 'err');
    if (e.code === 'auth') { state.cfg.token = null; await DB.del('kv', 'token'); }
    return;
  }
  startPolling(() => sync.refresh(), 30000);
}

/* ---------------- Roteador ---------------- */
async function route() {
  state.cleanup.splice(0).forEach(f => { try { f(); } catch {} });
  $$('.newpill').forEach(b => b.remove());
  window.scrollTo(0, 0);
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  try {
    if ((p[0] === 'e' || p[0] === 'up') && p[1] && p[2]) {
      let tok; try { tok = decTok(p[2]); } catch { tok = null; }
      if (!tok || !/^[\w-]{20,}$/.test(tok) || !/^[a-f0-9]{20,}$/i.test(p[1])) { app.innerHTML = msgScreen('alert', 'Link inválido', 'Este link parece incompleto. Escaneie o QR code novamente.'); return; }
      return p[0] === 'e' ? await Gallery(p[1], tok) : await Upload(p[1], tok);
    }
    if (p[0] === 'admin' && p[1] === 'evento' && p[2]) return await AdminEvent(p[2]);
    return await AdminHome();
  } catch (e) {
    console.error(e);
    app.innerHTML = msgScreen('alert', 'Algo deu errado', e.message || String(e), `<button class="btn" onclick="location.reload()">${ic('refresh')} Recarregar</button>`);
  }
}

(async function init() {
  state.cfg.token = await DB.get('kv', 'token');
  state.cfg.user = await DB.get('kv', 'user');
  state.cfg.baseUrl = (await DB.get('kv', 'baseUrl')) || '';
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
